---
# Multi-host LiteLLM (E5): Darwin launchd + Linux systemd --user.
# Unprovisioned hosts are ended in playbooks/litellm.yml pre_tasks (before SSH).

- name: Assert LiteLLM site facts and loopback-only bind
  ansible.builtin.assert:
    that:
      - site_ns is defined
      - site_ns | length > 0
      - litellm_bind == '127.0.0.1'
      - >-
          (ansible_facts.os_family == 'Darwin')
          or (ansible_facts.system == 'Linux')
    fail_msg: >-
      LiteLLM requires site_ns, loopback bind 127.0.0.1 (no public bind without
      an auth/master-key design), and Darwin or Linux.

# ── The LiteLLM *install* is deliberately not managed here ───────────────────
#
# This host runs LiteLLM from a git checkout (a fork of BerriAI/litellm) at
# {{ litellm_source_dir }}, so local provider work can be contributed upstream.
# It is installed by hand, outside Ansible:
#
#   uv tool install --editable "{{ litellm_source_dir }}[proxy,caching]"
#
# Ansible has no way to express a git-checkout source today, and the
# `uv tool install <pypi-spec>` install/repair tasks that used to live here
# would silently overwrite that editable checkout with an upstream PyPI build
# — reverting local providers with no error surfaced anywhere. This role now
# only ever *verifies* the runtime; it owns the config file and the service
# unit, and never mutates the binary, the shim, or the tool environment.

- name: Probe installed LiteLLM version
  ansible.builtin.command:
    argv:
      - "{{ litellm_bin }}"
      - --version
  register: _litellm_version_probe
  changed_when: false
  failed_when: false
  check_mode: false

- name: Require a working LiteLLM install
  ansible.builtin.assert:
    that: _litellm_version_probe.rc == 0
    fail_msg: >-
      No runnable LiteLLM at {{ litellm_bin }}. This role does not install it —
      install the git checkout by hand with:
      uv tool install --editable "{{ litellm_source_dir }}[proxy,caching]"

- name: Parse installed LiteLLM version
  ansible.builtin.set_fact:
    _litellm_current_version: >-
      {{
        ((_litellm_version_probe.stdout | default(''))
        ~ ' ' ~ (_litellm_version_probe.stderr | default('')))
        | regex_search('[0-9]+\.[0-9]+(?:\.[0-9]+)?(?:[a-z]+[0-9]+)?')
        | default('0.0.0', true)
      }}

- name: Enforce the Auto Router v2 LiteLLM version floor
  ansible.builtin.assert:
    that: _litellm_current_version is version(litellm_minimum_version, '>=')
    fail_msg: >-
      LiteLLM {{ _litellm_current_version }} is below the required
      {{ litellm_minimum_version }} Auto Router v2 floor. Update the checkout at
      {{ litellm_source_dir }} and reinstall it by hand — this role will not
      install over it.

- name: Resolve the package directory backing the LiteLLM tool install
  ansible.builtin.command:
    argv:
      - "{{ litellm_tool_python }}"
      - -c
      - "import litellm, pathlib; print(pathlib.Path(litellm.__file__).resolve().parent)"
  register: _litellm_pkg_dir
  changed_when: false
  failed_when: false
  check_mode: false

- name: Require the tool install to still point at the git checkout
  ansible.builtin.assert:
    that:
      - _litellm_pkg_dir.rc == 0
      - (_litellm_pkg_dir.stdout | trim) == (litellm_source_dir ~ '/litellm')
    fail_msg: >-
      The LiteLLM tool environment resolves to
      "{{ _litellm_pkg_dir.stdout | default('<probe failed>') | trim }}",
      not the expected checkout "{{ litellm_source_dir }}/litellm". Something
      reinstalled LiteLLM from PyPI, which drops any provider only present in
      the fork. Reinstall with:
      uv tool install --force --editable "{{ litellm_source_dir }}[proxy,caching]"

- name: Verify the disk-cache extra is present in the LiteLLM tool environment
  ansible.builtin.command:
    argv:
      - "{{ litellm_tool_python }}"
      - -c
      - import diskcache
  register: _litellm_cache_extra
  changed_when: false
  failed_when: false
  check_mode: false

- name: Require the disk-cache extra
  ansible.builtin.assert:
    that: _litellm_cache_extra.rc == 0
    fail_msg: >-
      `import diskcache` failed in {{ litellm_tool_python }}, so the configured
      disk cache would not work. Reinstall the checkout including extras:
      uv tool install --force --editable "{{ litellm_source_dir }}[proxy,caching]"

- name: Ensure LiteLLM runtime directories exist
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    mode: "{{ item.mode }}"
  loop: >-
    {{
      [
        {'path': litellm_config_dir, 'mode': '0700'},
        {'path': litellm_cache_dir, 'mode': '0700'},
        {'path': litellm_logs_dir, 'mode': '0700'},
      ]
      + (
        [{'path': litellm_home ~ '/Library/LaunchAgents', 'mode': '0755'}]
        if ansible_facts.os_family == 'Darwin'
        else [{'path': litellm_systemd_user_dir, 'mode': '0755'}]
      )
    }}

- name: Render Auto Router v2 LiteLLM config
  ansible.builtin.template:
    src: litellm-config.yaml.j2
    dest: "{{ litellm_config_path }}"
    mode: "0600"
  register: _litellm_config

- name: Manage Darwin LaunchAgent for LiteLLM
  ansible.builtin.include_tasks: service_darwin.yml
  when: ansible_facts.os_family == 'Darwin'

- name: Manage Linux systemd user unit for LiteLLM
  ansible.builtin.include_tasks: service_linux.yml
  when: ansible_facts.os_family != 'Darwin'

- name: Wait for the LiteLLM models endpoint
  ansible.builtin.uri:
    url: "{{ litellm_health_url }}"
    status_code: 200
  register: _litellm_health
  until: _litellm_health.status == 200
  retries: 60
  delay: 2
  when: not ansible_check_mode

---
# Per-client virtual keys, so LiteLLM_SpendLogs can say which client spent what.
# Rationale and the consumer list: litellm_client_keys in defaults/main.yml.
#
# Idempotent: a key that already exists is left alone (never regenerated, so
# its spend history stays attached to it).
- name: Look up the per-client LiteLLM virtual keys
  ansible.builtin.uri:
    url: "http://{{ litellm_bind }}:{{ litellm_port }}/key/info?key={{ item.key }}"
    headers:
      Authorization: "Bearer {{ litellm_master_key }}"
    status_code: [200, 404]
  loop: "{{ litellm_client_keys }}"
  loop_control:
    label: "{{ item.alias }}"
  register: _litellm_client_key_info
  # The master key is in `headers` (#83 review 1.1g). ansible-core 2.21 does not
  # print a uri task's `invocation` even at -vvvv, but older releases and other
  # callbacks can, so no_log keeps it out regardless. It also censors this
  # task's errors: to debug, drop no_log locally with a throwaway key.
  # ANSIBLE_DEBUG=1 logs the key whatever no_log says: never use it with a real one.
  no_log: true

- name: Create the missing per-client LiteLLM virtual keys
  ansible.builtin.uri:
    url: "http://{{ litellm_bind }}:{{ litellm_port }}/key/generate"
    method: POST
    headers:
      Authorization: "Bearer {{ litellm_master_key }}"
    body_format: json
    body:
      key: "{{ item.item.key }}"
      key_alias: "{{ item.item.alias }}"
      user_id: "{{ item.item.alias }}"
    status_code: 200
  loop: "{{ _litellm_client_key_info.results }}"
  loop_control:
    label: "{{ item.item.alias }}"
  when: item.status == 404
  changed_when: true
  # The master key is in `headers` (#83 review 1.1g). ansible-core 2.21 does not
  # print a uri task's `invocation` even at -vvvv, but older releases and other
  # callbacks can, so no_log keeps it out regardless. It also censors this
  # task's errors: to debug, drop no_log locally with a throwaway key.
  # ANSIBLE_DEBUG=1 logs the key whatever no_log says: never use it with a real one.
  no_log: true

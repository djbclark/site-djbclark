---
# roles/litellm — site-owned, loopback-only LiteLLM proxy (Phase E1 + E5 multi-host).

# Prefer remote facts env so multi-host SSH apply does not use the control
# node's home. Local connection still resolves correctly.
litellm_home: >-
  {{
    (ansible_facts.get('env') or {}).get('HOME')
    | default(lookup('env', 'HOME'), true)
  }}
litellm_uid: "{{ ansible_facts['user_uid'] }}"
litellm_label: "com.{{ site_ns }}.litellm"
litellm_bind: "127.0.0.1"
litellm_port: 4000

# Caddy fronts this proxy at /litellm/* with the path prefix stripped before
# forwarding (handle_path — LiteLLM's own FastAPI routes, e.g. the custom
# Swagger asset mount `app.mount("/swagger", ...)`, are registered at their
# bare paths and never see the prefix; see proxy_server.py). SERVER_ROOT_PATH
# is the app-side knob (read via litellm.proxy.utils.get_server_root_path())
# that tells LiteLLM what its externally-visible prefix is, purely so it
# generates correct absolute links (Swagger JS/CSS URLs, the OpenAPI
# "servers" entry, /ui redirects) — it does not change what paths the proxy
# itself listens on. Must keep the trailing slash: proxy_server.py builds
# swagger asset URLs as `server_root_path + "swagger/..."` with no separator.
litellm_server_root_path: "/litellm/"

# Auto Router v2 first ships in the 1.94 train. As of 2026-07-20 PyPI's
# newest stable is 1.93.0 and the first usable 1.94 build is 1.94.0rc1.
litellm_minimum_version: "1.94.0rc1"
litellm_bin: "{{ litellm_home }}/.local/bin/litellm"
litellm_tool_python: "{{ litellm_home }}/.local/share/uv/tools/litellm/bin/python"

# LiteLLM runs from a git checkout (fork of BerriAI/litellm) so provider work
# here can be contributed upstream. The install is performed by hand — see the
# banner comment in tasks/main.yml — and this role only verifies it. There is
# deliberately no package spec: nothing in this role may install over the
# checkout, because a PyPI build silently drops fork-only providers.
litellm_source_dir: "{{ litellm_home }}/src/litellm"

# Homebrew prefix: Apple Silicon /opt/homebrew, Intel /usr/local
# (same pattern as stayturgid stayturgid_homebrew_prefix).
litellm_homebrew_prefix: >-
  {{
    '/opt/homebrew'
    if ansible_facts.get('architecture', 'arm64') in ['arm64', 'aarch64']
    else '/usr/local'
  }}

litellm_config_dir: "{{ litellm_home }}/.litellm"
litellm_config_path: "{{ litellm_config_dir }}/config.yaml"
litellm_cache_dir: "{{ litellm_config_dir }}/cache"

# Darwin → LaunchAgents + ~/Library/Logs; Linux → systemd --user + XDG state.
litellm_logs_dir: >-
  {{
    (litellm_home ~ '/Library/Logs/litellm')
    if ansible_facts.get('os_family') == 'Darwin'
    else (litellm_home ~ '/.local/state/litellm/logs')
  }}
litellm_plist_path: "{{ litellm_home }}/Library/LaunchAgents/{{ litellm_label }}.plist"
litellm_systemd_user_dir: "{{ litellm_home }}/.config/systemd/user"
litellm_unit_path: "{{ litellm_systemd_user_dir }}/{{ litellm_label }}.service"
litellm_health_url: "http://{{ litellm_bind }}:{{ litellm_port }}/v1/models"

# PATH for the managed service env (Homebrew first on Darwin).
litellm_service_path: >-
  {{
    (
      litellm_homebrew_prefix ~ '/bin:'
      ~ litellm_homebrew_prefix ~ '/sbin:'
      ~ '/usr/local/bin:/usr/bin:/bin:'
      ~ litellm_home ~ '/.local/bin'
    )
    if ansible_facts.get('os_family') == 'Darwin'
    else (
      litellm_home ~ '/.local/bin:/usr/local/bin:/usr/bin:/bin'
    )
  }}

# Values enter Ansible from the ambient environment, normally through
# `secretspec run`. They are rendered only into the mode-0600 live unit/plist.
# ClinePass is the only backend this proxy serves, so it is the only key that
# is ever rendered into the unit/plist. The OPENAI/ANTHROPIC/DEEPSEEK/GEMINI/
# OPENROUTER/OPENCODE_ZEN vars were removed on 2026-08-21 along with their
# model_list entries — keeping them would embed live secrets in a mode-0600
# file for backends nothing can route to.
#
# The vault name is CLINE_API_KEY (declared, described "ClinePass API Key"),
# not CLINEPASS_API_KEY: the credential already existed, so this reuses it
# rather than declaring a fourth copy of the same secret. The name the daemon
# itself reads stays CLINEPASS_API_KEY — that is the unit/plist env var and
# the `os.environ/` reference in litellm-config.yaml.j2, independent of what
# the credential is called in the vault.
litellm_clinepass_api_key: "{{ lookup('env', 'CLINE_API_KEY') | default('', true) }}"

# Gemini API free tier, the LAST fallback (2026-09-25; see the fallbacks block
# in templates/litellm-config.yaml.j2). The API itself is sanctioned for
# general use (unlike the Gemini *subscription*); the free tier is rate-capped,
# so it fails loudly rather than billing when exhausted.
litellm_gemini_api_key: "{{ lookup('env', 'GEMINI_API_KEY') | default('', true) }}"
litellm_gemini_fallback_models:
  - { name: gemini-free, model: gemini/gemini-3.7-flash }
  - { name: gemini-free-lite, model: gemini/gemini-flash-lite-latest }

# SuperGrok subscription via xAI OAuth (2026-09-26, operator decision): a
# fallback after the ClinePass models and before the Gemini free tier. LiteLLM
# cannot hold a rotating OAuth grant, so a loopback bridge
# (bin/xai_oauth_bridge.py, run under the Hermes venv) injects a fresh token
# per request using Hermes's own resolver and lock, sharing the one grant in
# ~/.hermes/auth.json with Hermes. No API key is rendered anywhere. Darwin
# only: Hermes, and therefore the grant, lives on the Mac.
litellm_xai_bridge_enabled: "{{ ansible_facts.get('os_family') == 'Darwin' }}"
litellm_xai_bridge_label: "com.{{ site_ns }}.xai-oauth-bridge"
litellm_xai_bridge_port: 14011
litellm_xai_bridge_python: "{{ litellm_home }}/.hermes/hermes-agent/venv/bin/python"
litellm_xai_bridge_script: "{{ playbook_dir | dirname }}/bin/xai_oauth_bridge.py"
# Log budget (2026-09-26, operator: <= 100 MB for the whole logs dir, rotated
# files included). Proxy 20 MB x (1 + 3) = 80 MB, bridge 5 MB x (1 + 1) =
# 10 MB, launchd.log files stay tiny (shell errors only). Filtering and
# rotation: bin/litellm_logpipe.py. The Hermes cron "LLM Backend Health" warns
# if the directory ever exceeds 100 MB.
litellm_logpipe_script: "{{ playbook_dir | dirname }}/bin/litellm_logpipe.py"
litellm_log_max_bytes: 20000000
litellm_log_backups: 3
litellm_xai_bridge_log_max_bytes: 5000000
litellm_xai_bridge_log_backups: 1
litellm_xai_bridge_plist_path: "{{ litellm_home }}/Library/LaunchAgents/{{ litellm_xai_bridge_label }}.plist"
# Fast non-reasoning model: Hindsight's fallback load is fact extraction.
litellm_xai_fallback_model: grok-4.20-0309-non-reasoning

# Generation ceiling and the timeout that actually enforces it. See the
# rationale block in templates/litellm-config.yaml.j2 — these three are one
# decision, not three independent knobs.
litellm_max_tokens: 16000
litellm_request_timeout: 600
litellm_num_retries: 1

# ClinePass self-throttle (2026-09-26). ClinePass has no usage API, so the only
# way to not spend the subscription is to not send the requests. `aiuse` on
# 2026-09-26 read weekly 100% used (resets 09-29T12:56Z) and MONTHLY 99% used
# (resets 10-16T07:42Z) — i.e. the 09-29 weekly reset buys ~1% of a month and
# is gone again immediately. Hindsight's fact-extraction load is what spent it;
# see the fallbacks block in templates/litellm-config.yaml.j2 for where that
# load went instead.
#
# This is a runaway ceiling, not a budget: it bounds a retry storm (the failure
# mode that actually happened), it cannot enforce a weekly allowance. The real
# protection is that ClinePass is no longer anyone's primary.
litellm_clinepass_rpm: 10

# Cooldowns. LiteLLM will NOT cool down a model_group that has exactly one
# deployment on a 429 — see _should_cooldown_deployment() in
# litellm/router_utils/cooldown_handlers.py: the `exception_status_int == 429`
# branch is guarded by `and not is_single_deployment_model_group`, and the
# single-deployment escape hatch needs SINGLE_DEPLOYMENT_TRAFFIC_FAILURE_THRESHOLD
# (default 1000) requests IN ONE MINUTE before it fires. Every model_group here
# has one deployment and we never see 1000 rpm, so cooldowns never engaged:
# during the multi-day ClinePass cap every single request re-probed all three
# ClinePass models, num_retries+1 times each, before falling through. The logs
# show `Cooldown Deployments=[]` beside tens of thousands of 429s.
#
# Setting allowed_fails to a NON-DEFAULT value (litellm.allowed_fails is 3)
# routes the decision through should_cooldown_based_on_allowed_fails_policy(),
# which has no single-deployment special case. Changing this back to 3 silently
# restores the old never-cooldown behaviour — it is the non-defaultness that
# switches branches, so do not "tidy" it.
litellm_allowed_fails: 2
litellm_cooldown_time: 300

---
# Installs files/ignore as the global git excludes file. The repo copy is
# canonical. A live file that differs is never overwritten silently: the play
# fails and shows the diff unless git_ignore_adopt=true.

- name: Stat the live excludes file (not following symlinks)
  ansible.builtin.stat:
    path: "{{ git_ignore_dest }}"
    follow: false
    checksum_algorithm: sha256
  register: _git_ignore_live

- name: Stat the repo copy
  ansible.builtin.stat:
    path: "{{ role_path }}/files/ignore"
    checksum_algorithm: sha256
  register: _git_ignore_repo

- name: Refuse a live path that is not a regular file
  ansible.builtin.assert:
    that: not _git_ignore_live.stat.exists or _git_ignore_live.stat.isreg
    fail_msg: >-
      {{ git_ignore_dest }} exists but is not a regular file (symlink or
      directory). Resolve it by hand; this role does not replace it.

- name: Show the drift between the live file and the repo copy
  ansible.builtin.command:
    argv: [diff, -u, "{{ git_ignore_dest }}", "{{ role_path }}/files/ignore"]
  register: _git_ignore_diff
  changed_when: false
  failed_when: _git_ignore_diff.rc > 1
  when:
    - _git_ignore_live.stat.exists
    - _git_ignore_live.stat.checksum != _git_ignore_repo.stat.checksum

- name: Refuse to clobber a live file that differs from the repo copy
  ansible.builtin.assert:
    that: git_ignore_adopt | bool
    fail_msg: |-
      {{ git_ignore_dest }} differs from roles/git_ignore/files/ignore.
      Fold the live edits into the repo copy, or re-run with
      -e git_ignore_adopt=true to replace the live file (a backup is kept).
      {{ _git_ignore_diff.stdout | default('') }}
  when: _git_ignore_diff is not skipped

- name: Ensure the config directory exists
  ansible.builtin.file:
    path: "{{ git_ignore_dest | dirname }}"
    state: directory
    mode: "0755"

- name: Install the global excludes file
  ansible.builtin.copy:
    src: ignore
    dest: "{{ git_ignore_dest }}"
    mode: "0644"
    backup: "{{ git_ignore_adopt | bool }}"
  when: not _git_ignore_live.stat.exists or _git_ignore_diff is not skipped
  register: _git_ignore_install

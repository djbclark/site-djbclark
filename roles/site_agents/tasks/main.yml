---
# Control-node maintenance LaunchAgents (Phase F1): system-state-backup +
# hibernate-disk-check. Darwin only.

- name: Assert site_agents prerequisites
  ansible.builtin.assert:
    that:
      - ansible_facts.os_family == 'Darwin'
      - site_ns is defined
      - site_ns | length > 0
    fail_msg: >-
      site_agents supports macOS control-node deployment only; requires site_ns.

- name: Ensure runtime directories exist
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    mode: "{{ item.mode }}"
  loop:
    - {path: "{{ site_agents_bin_dir }}", mode: "0755"}
    - {path: "{{ site_agents_state_dir }}", mode: "0755"}
    - {path: "{{ site_agents_jobber_state_dir }}", mode: "0755"}
    - {path: "{{ site_agents_jobber_var_dir }}", mode: "0755"}
    - {path: "{{ site_agents_launchagents_dir }}", mode: "0755"}
    - {path: "{{ site_agents_system_state_var_dir }}", mode: "0755"}
    - {path: "{{ site_agents_system_state_home_mirror }}", mode: "0755"}
    - {path: "{{ site_agents_homebrew_prefix }}/var/log", mode: "0755"}


- name: Install system-state-backup script
  ansible.builtin.template:
    src: system-state-backup.sh.j2
    dest: "{{ site_agents_system_state_script }}"
    mode: "0755"
  register: _system_state_script

- name: Install hibernate-disk-check script
  ansible.builtin.copy:
    src: hibernate-disk-check
    dest: "{{ site_agents_hibernate_script }}"
    mode: "0755"
  register: _hibernate_script

- name: Render system-state-backup LaunchAgent
  ansible.builtin.template:
    src: system-state-backup.plist.j2
    dest: "{{ site_agents_system_state_plist }}"
    mode: "0644"
  register: _system_state_plist

- name: Render hibernate-disk-check LaunchAgent
  ansible.builtin.template:
    src: hibernate-disk-check.plist.j2
    dest: "{{ site_agents_hibernate_plist }}"
    mode: "0644"
  register: _hibernate_plist

- name: Manage system-state-backup LaunchAgent
  ansible.builtin.include_tasks: launchagent.yml
  vars:
    _agent_label: "{{ site_agents_system_state_label }}"
    _agent_plist_path: "{{ site_agents_system_state_plist }}"
    _agent_plist: "{{ _system_state_plist }}"
    _agent_script: "{{ _system_state_script }}"

- name: Render cswap-auto LaunchAgent
  ansible.builtin.template:
    src: cswap-auto.plist.j2
    dest: "{{ site_agents_cswap_plist }}"
    mode: "0644"
  register: _cswap_plist

- name: Manage hibernate-disk-check LaunchAgent
  ansible.builtin.include_tasks: launchagent.yml
  vars:
    _agent_label: "{{ site_agents_hibernate_label }}"
    _agent_plist_path: "{{ site_agents_hibernate_plist }}"
    _agent_plist: "{{ _hibernate_plist }}"
    _agent_script: "{{ _hibernate_script }}"

- name: Manage cswap-auto LaunchAgent
  ansible.builtin.include_tasks: launchagent.yml
  vars:
    _agent_label: "{{ site_agents_cswap_label }}"
    _agent_plist_path: "{{ site_agents_cswap_plist }}"
    _agent_plist: "{{ _cswap_plist }}"
    _agent_script: "{{ site_agents_cswap_plist }}"

- name: Assert aiuse binary is present
  ansible.builtin.stat:
    path: "{{ site_agents_aiuse_bin }}"
  register: _aiuse_bin_stat

- name: Fail when aiuse is missing from PATH install location
  ansible.builtin.assert:
    that:
      - _aiuse_bin_stat.stat.exists
    fail_msg: >-
      {{ site_agents_aiuse_bin }} not found.
      Install with: pipx install aiuse   (or brew tap djbclark/aiuse && brew install aiuse,
      then symlink/copy into ~/.local/bin or override site_agents_aiuse_bin).

- name: Ensure aiuse config directory exists
  ansible.builtin.file:
    path: "{{ site_agents_aiuse_config_dir }}"
    state: directory
    mode: "0700"

- name: Inspect aiuse user configuration files
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "{{ site_agents_aiuse_config_toml }}"
    - "{{ site_agents_aiuse_legacy_services_yaml }}"
  register: site_agents_aiuse_config_files

- name: Refuse conflicting aiuse user configuration files
  ansible.builtin.assert:
    that:
      - not (site_agents_aiuse_config_files.results[0].stat.exists and site_agents_aiuse_config_files.results[1].stat.exists)
    fail_msg: >-
      Both {{ site_agents_aiuse_config_toml }} and
      {{ site_agents_aiuse_legacy_services_yaml }} exist. Move the settings
      from services.yaml into config.toml, then remove services.yaml before
      running site-agents-apply.

- name: Seed aiuse TOML configuration for snapshot history
  ansible.builtin.copy:
    dest: "{{ site_agents_aiuse_config_toml }}"
    content: |
      [analysis]
      persist_snapshots = true
      learn_from_history = "auto"
    mode: "0600"
  when:
    - not site_agents_aiuse_config_files.results[0].stat.exists
    - not site_agents_aiuse_config_files.results[1].stat.exists

- name: Render aiuse LaunchAgent
  ansible.builtin.template:
    src: aiuse.plist.j2
    dest: "{{ site_agents_aiuse_plist }}"
    mode: "0644"
  register: _aiuse_plist

- name: Manage aiuse LaunchAgent
  ansible.builtin.include_tasks: launchagent.yml
  vars:
    _agent_label: "{{ site_agents_aiuse_label }}"
    _agent_plist_path: "{{ site_agents_aiuse_plist }}"
    _agent_plist: "{{ _aiuse_plist }}"
    _agent_script: "{{ site_agents_aiuse_plist }}"

- name: Install jobber-notify script
  ansible.builtin.template:
    src: jobber-notify.py.j2
    dest: "{{ site_agents_jobber_notify_script }}"
    mode: "0755"
  register: _jobber_notify_script

- name: Install brew-fast-upgrade script
  ansible.builtin.template:
    src: brew-fast-upgrade.sh.j2
    dest: "{{ site_agents_brew_fast_upgrade_script }}"
    mode: "0755"

- name: Install landing-health script
  ansible.builtin.template:
    src: landing-health.sh.j2
    dest: "{{ site_agents_landing_health_script }}"
    mode: "0755"

- name: Install chrome-cache-trim script
  ansible.builtin.template:
    src: chrome-cache-trim.sh.j2
    dest: "{{ site_agents_chrome_cache_trim_script }}"
    mode: "0755"

- name: Read current Chrome cache policy defaults
  ansible.builtin.command:
    argv: [defaults, read, com.google.Chrome, "{{ item.key }}"]
  loop: "{{ site_agents_chrome_cache_defaults }}"
  register: _site_agents_chrome_defaults
  changed_when: false
  failed_when: false
  check_mode: false
  tags: [chrome-cache]

- name: Set Chrome cache policy defaults (idempotent)
  ansible.builtin.command:
    argv: [defaults, write, com.google.Chrome, "{{ item.item.key }}", -int, "{{ item.item.bytes }}"]
  loop: "{{ _site_agents_chrome_defaults.results }}"
  loop_control:
    label: "{{ item.item.key }}"
  when: (item.stdout | default('') | trim) != (item.item.bytes | string)
  tags: [chrome-cache]

- name: Deploy Jobber configuration
  ansible.builtin.template:
    src: jobber.yaml.j2
    dest: "{{ site_agents_jobber_config }}"
    mode: "0600"
  register: _jobber_config

- name: Render Jobber LaunchAgent plist
  ansible.builtin.template:
    src: jobber.plist.j2
    dest: "{{ site_agents_jobber_plist }}"
    mode: "0644"
  register: _jobber_plist

- name: Manage Jobber LaunchAgent
  ansible.builtin.include_tasks: launchagent.yml
  vars:
    _agent_label: "{{ site_agents_jobber_label }}"
    _agent_plist_path: "{{ site_agents_jobber_plist }}"
    _agent_plist: "{{ _jobber_plist }}"
    _agent_script: "{{ _jobber_config }}"

- name: Assert hermes CLI is present
  ansible.builtin.stat:
    path: "{{ site_agents_hermes_bin }}"
  register: _hermes_bin_stat
  when: site_agents_hermes_dashboard_enabled | bool
  tags: [hermes-dashboard]

- name: Fail when hermes CLI is missing
  ansible.builtin.assert:
    that:
      - _hermes_bin_stat.stat.exists
    fail_msg: >-
      {{ site_agents_hermes_bin }} not found. The dashboard LaunchAgent
      execs that binary; install Hermes before applying this agent.
  when: site_agents_hermes_dashboard_enabled | bool
  tags: [hermes-dashboard]

- name: Render hermes-dashboard LaunchAgent
  ansible.builtin.template:
    src: hermes-dashboard.plist.j2
    dest: "{{ site_agents_hermes_dashboard_plist }}"
    mode: "0644"
  register: _hermes_dashboard_plist
  when: site_agents_hermes_dashboard_enabled | bool
  tags: [hermes-dashboard]

- name: Manage hermes-dashboard LaunchAgent
  ansible.builtin.include_tasks:
    file: launchagent.yml
    apply:
      tags: [hermes-dashboard]
  vars:
    _agent_label: "{{ site_agents_hermes_dashboard_label }}"
    _agent_plist_path: "{{ site_agents_hermes_dashboard_plist }}"
    _agent_plist: "{{ _hermes_dashboard_plist }}"
    _agent_script: "{{ site_agents_hermes_dashboard_plist }}"
  when: site_agents_hermes_dashboard_enabled | bool
  tags: [hermes-dashboard]

# S1 evidence ingest cycle (2026-10-12). Off by default; see defaults/main.yml.
- name: Check the S1 ingest cycle script and interpreter
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "{{ site_agents_s1_ingest_bin_dir }}/s1_cycle.py"
    - "{{ site_agents_s1_ingest_python }}"
  register: site_agents_s1_ingest_paths_stat
  when: site_agents_s1_ingest_enabled | bool
  tags: [s1-ingest]

- name: Fail when the S1 ingest cycle cannot run
  ansible.builtin.assert:
    that:
      - site_agents_s1_ingest_paths_stat.results | rejectattr('stat.exists') | list | length == 0
    fail_msg: >-
      {{ site_agents_s1_ingest_bin_dir }}/s1_cycle.py or
      {{ site_agents_s1_ingest_python }} not found; override
      site_agents_s1_ingest_bin_dir / site_agents_s1_ingest_python.
  when: site_agents_s1_ingest_enabled | bool
  tags: [s1-ingest]

- name: Render s1-ingest LaunchAgent
  ansible.builtin.template:
    src: s1-ingest.plist.j2
    dest: "{{ site_agents_s1_ingest_plist }}"
    mode: "0644"
  register: site_agents_s1_ingest_rendered
  when: site_agents_s1_ingest_enabled | bool
  tags: [s1-ingest]

- name: Manage s1-ingest LaunchAgent
  ansible.builtin.include_tasks:
    file: launchagent.yml
    apply:
      tags: [s1-ingest]
  vars:
    _agent_label: "{{ site_agents_s1_ingest_label }}"
    _agent_plist_path: "{{ site_agents_s1_ingest_plist }}"
    _agent_plist: "{{ site_agents_s1_ingest_rendered }}"
    _agent_script: "{{ site_agents_s1_ingest_plist }}"
  when: site_agents_s1_ingest_enabled | bool
  tags: [s1-ingest]

# Disabled: boot out a loaded job and remove its plist (which also turns
# fleet-watch's S1 freshness check off). A no-op when it was never enabled.
- name: Probe whether s1-ingest is loaded
  ansible.builtin.command:
    argv: [launchctl, print, "gui/{{ site_agents_uid }}/{{ site_agents_s1_ingest_label }}"]
  register: site_agents_s1_ingest_launch_state
  changed_when: false
  failed_when: false
  check_mode: false
  when: not (site_agents_s1_ingest_enabled | bool)
  tags: [s1-ingest]

- name: Boot out s1-ingest while disabled
  ansible.builtin.command:
    argv: [launchctl, bootout, "gui/{{ site_agents_uid }}/{{ site_agents_s1_ingest_label }}"]
  changed_when: true
  when:
    - not (site_agents_s1_ingest_enabled | bool)
    - not ansible_check_mode
    - site_agents_s1_ingest_launch_state.rc == 0
  tags: [s1-ingest]

- name: Remove s1-ingest LaunchAgent while disabled
  ansible.builtin.file:
    path: "{{ site_agents_s1_ingest_plist }}"
    state: absent
  when: not (site_agents_s1_ingest_enabled | bool)
  tags: [s1-ingest]

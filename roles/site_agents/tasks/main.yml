---
# Control-node maintenance LaunchAgents (Phase F1): system-state-backup +
# hibernate-disk-check. Darwin only.

- name: Assert site_agents prerequisites
  ansible.builtin.assert:
    that:
      - ansible_facts.os_family == 'Darwin'
      - site_ns is defined
      - site_ns | length > 0
    fail_msg: >-
      site_agents supports macOS control-node deployment only; requires site_ns.

- name: Ensure runtime directories exist
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    mode: "{{ item.mode }}"
  loop:
    - {path: "{{ site_agents_bin_dir }}", mode: "0755"}
    - {path: "{{ site_agents_state_dir }}", mode: "0755"}
    - {path: "{{ site_agents_launchagents_dir }}", mode: "0755"}
    - {path: "{{ site_agents_system_state_var_dir }}", mode: "0755"}
    - {path: "{{ site_agents_system_state_home_mirror }}", mode: "0755"}
    - {path: "{{ site_agents_homebrew_prefix }}/var/log", mode: "0755"}

- name: Install system-state-backup script
  ansible.builtin.template:
    src: system-state-backup.sh.j2
    dest: "{{ site_agents_system_state_script }}"
    mode: "0755"
  register: _system_state_script

- name: Install hibernate-disk-check script
  ansible.builtin.copy:
    src: hibernate-disk-check
    dest: "{{ site_agents_hibernate_script }}"
    mode: "0755"
  register: _hibernate_script

- name: Render system-state-backup LaunchAgent
  ansible.builtin.template:
    src: system-state-backup.plist.j2
    dest: "{{ site_agents_system_state_plist }}"
    mode: "0644"
  register: _system_state_plist

- name: Render hibernate-disk-check LaunchAgent
  ansible.builtin.template:
    src: hibernate-disk-check.plist.j2
    dest: "{{ site_agents_hibernate_plist }}"
    mode: "0644"
  register: _hibernate_plist

- name: Manage system-state-backup LaunchAgent
  ansible.builtin.include_tasks: launchagent.yml
  vars:
    _agent_label: "{{ site_agents_system_state_label }}"
    _agent_plist_path: "{{ site_agents_system_state_plist }}"
    _agent_plist: "{{ _system_state_plist }}"
    _agent_script: "{{ _system_state_script }}"

- name: Manage hibernate-disk-check LaunchAgent
  ansible.builtin.include_tasks: launchagent.yml
  vars:
    _agent_label: "{{ site_agents_hibernate_label }}"
    _agent_plist_path: "{{ site_agents_hibernate_plist }}"
    _agent_plist: "{{ _hibernate_plist }}"
    _agent_script: "{{ _hibernate_script }}"

---
# roles/site_agents — control-node maintenance LaunchAgents (Phase F1).

site_agents_home: >-
  {{
    (ansible_facts.get('env') or {}).get('HOME')
    | default(lookup('env', 'HOME'), true)
  }}
site_agents_uid: "{{ ansible_facts['user_uid'] }}"

# Homebrew prefix: Apple Silicon /opt/homebrew, Intel /usr/local
# (same pattern as litellm stayturgid_homebrew_prefix).
site_agents_homebrew_prefix: >-
  {{
    '/opt/homebrew'
    if ansible_facts.get('architecture', 'arm64') in ['arm64', 'aarch64']
    else '/usr/local'
  }}

site_agents_bin_dir: "{{ site_agents_home }}/.local/bin"
site_agents_state_dir: "{{ site_agents_home }}/.local/state"
site_agents_launchagents_dir: "{{ site_agents_home }}/Library/LaunchAgents"

# --- system-state-backup ----------------------------------------------------
site_agents_system_state_label: "com.{{ site_ns }}.system-state-backup"
site_agents_system_state_script: "{{ site_agents_bin_dir }}/system-state-backup.sh"
site_agents_system_state_var_dir: "{{ site_agents_homebrew_prefix }}/var/system-state"
site_agents_system_state_log: "{{ site_agents_homebrew_prefix }}/var/log/system-state-backup.log"
site_agents_system_state_home_mirror: "{{ site_agents_home }}/system-state"
site_agents_system_state_plist: >-
  {{ site_agents_launchagents_dir }}/{{ site_agents_system_state_label }}.plist

# --- hibernate-disk-check ---------------------------------------------------
site_agents_hibernate_label: "com.{{ site_ns }}.hibernate-disk-check"
site_agents_hibernate_script: "{{ site_agents_bin_dir }}/hibernate-disk-check"
site_agents_hibernate_threshold_gb: 25
site_agents_hibernate_plist: >-
  {{ site_agents_launchagents_dir }}/{{ site_agents_hibernate_label }}.plist
site_agents_hibernate_log: "{{ site_agents_state_dir }}/hibernate-disk-check.log"
site_agents_hibernate_error_log: "{{ site_agents_state_dir }}/hibernate-disk-check.error.log"

# --- cswap-auto --------------------------------------------------------------
site_agents_cswap_label: "com.{{ site_ns }}.cswap-auto"
site_agents_cswap_plist: >-
  {{ site_agents_launchagents_dir }}/{{ site_agents_cswap_label }}.plist
site_agents_cswap_log: "{{ site_agents_state_dir }}/cswap-auto.log"
site_agents_cswap_error_log: "{{ site_agents_state_dir }}/cswap-auto.error.log"
site_agents_cswap_threshold: 90
site_agents_cswap_interval: 60
site_agents_cswap_cooldown: 300
site_agents_cswap_model: "all"

# --- aiuse (quota snapshot collector) ----------------------------------------
# `aiuse sample` (aiuse >= 3.2.0) fired every 3 minutes. Most firings return at
# once: aiuse itself collects hourly when idle, every 15 min when a quota window
# moved, and every 3 min during a burst (the burning providers only), so
# `aiuse attribute` can line the meters up against the token ledgers. Cadence
# is tuned in ~/.config/aiuse/config.toml [sampling], not here.
# New installations get a TOML config enabling history. Existing user config is
# never edited: aiuse owns migration of a legacy YAML-only configuration.
site_agents_aiuse_label: "com.{{ site_ns }}.aiuse"
site_agents_aiuse_plist: >-
  {{ site_agents_launchagents_dir }}/{{ site_agents_aiuse_label }}.plist
site_agents_aiuse_bin: "{{ site_agents_bin_dir }}/aiuse"
site_agents_aiuse_log: "{{ site_agents_state_dir }}/aiuse.log"
site_agents_aiuse_error_log: "{{ site_agents_state_dir }}/aiuse.error.log"
site_agents_aiuse_interval_seconds: 180
site_agents_aiuse_config_dir: "{{ site_agents_home }}/.config/aiuse"
site_agents_aiuse_config_toml: "{{ site_agents_aiuse_config_dir }}/config.toml"
site_agents_aiuse_legacy_services_yaml: "{{ site_agents_aiuse_config_dir }}/services.yaml"

# --- s1-ingest (S1 evidence store ingest cycle) ------------------------------
# bin/s1_cycle.py every 15 minutes: s1_claude scan, s1_hermes sink, s1_search
# index, under ~/.local/share/s1-evidence/ingest.lock, skipping while
# maintenance.lock exists, killing its own steps after the deadline. Nothing
# scheduled these one-shot adapters until 2026-10-12 and the store sat seven
# weeks stale; fleet-watch pages on staleness while this plist is installed.
# Off by default: false keeps the plist absent (and boots out a loaded job).
site_agents_s1_ingest_enabled: false
site_agents_s1_ingest_label: "com.{{ site_ns }}.s1-ingest"
site_agents_s1_ingest_plist: >-
  {{ site_agents_launchagents_dir }}/{{ site_agents_s1_ingest_label }}.plist
# Scripts run from this checkout's bin/ (deployments read from ~/ops).
site_agents_s1_ingest_bin_dir: "{{ role_path | dirname | dirname }}/bin"
site_agents_s1_ingest_python: "{{ site_agents_homebrew_prefix }}/bin/python3"
site_agents_s1_ingest_log: "{{ site_agents_state_dir }}/s1-ingest.log"
site_agents_s1_ingest_error_log: "{{ site_agents_state_dir }}/s1-ingest.error.log"
site_agents_s1_ingest_interval_seconds: 900
site_agents_s1_ingest_deadline_seconds: 3000
site_agents_s1_ingest_nice: 10

# --- jobber / brew-fast-upgrade ---------------------------------------------
site_agents_jobber_label: "homebrew.mxcl.jobber"
site_agents_jobber_config: "{{ site_agents_home }}/.jobber"
site_agents_jobber_notify_script: "{{ site_agents_bin_dir }}/jobber-notify"
site_agents_jobber_state_dir: "{{ site_agents_state_dir }}/jobber"
site_agents_jobber_var_dir: "{{ site_agents_homebrew_prefix }}/var/jobber/{{ site_agents_uid }}"
site_agents_brew_fast_upgrade_script: "{{ site_agents_bin_dir }}/brew-fast-upgrade"
# External volume holding the redirected Homebrew/npm/yarn caches (the same
# $USB_DRIVE that ~/.bashrc points HOMEBREW_CACHE at). brew-fast-upgrade uses
# it only when it is genuinely mounted. Set to "" on a host without one.
site_agents_brew_cache_volume: /Volumes/mac256usb
site_agents_landing_health_script: "{{ site_agents_bin_dir }}/landing-health"
site_agents_chrome_cache_trim_script: "{{ site_agents_bin_dir }}/chrome-cache-trim"
site_agents_apfs_compress_script: "{{ site_agents_bin_dir }}/apfs-compress"
# uv processes the apfs-compress job ignores when deciding whether uv is idle
# (long-lived servers that hold the uv cache lock for days). ERE for grep -E.
# Cold agent transcripts (HOME-relative) that the apfs-compress job also compresses:
# text-like files (jsonl/json/log/txt) not modified for 7+ days and not open for
# write. Never add live SQLite stores (hermes state.db, opencode.db, cursor chats,
# s1-evidence) here.
site_agents_apfs_compress_cold_dirs:
  - .claude/projects
  - .codex/sessions
  - .grok/sessions
  - .copilot/session-state
  - .local/state/acp-run
site_agents_apfs_compress_uv_keep: 'saner_mcp\.py|stayturgid/control/bin/dashboard\.py'
# Chrome cache policy (user defaults) — the HTTP/media disk cache caps the
# chrome-cache-trim job does NOT cover (it only clears profile caches the policy
# leaves unbounded). Integer bytes; applied by the "Set Chrome cache policy
# defaults" task. DiskCacheSize subsumes the documented 1/10-of-free-space rule
# of thumb; see README.md and reference_chrome_disk_cache_policy_2026-10-11.md.
site_agents_chrome_cache_defaults:
  - {key: DiskCacheSize, bytes: 536870912}
  - {key: MediaCacheSize, bytes: 268435456}
site_agents_jobber_plist: "{{ site_agents_launchagents_dir }}/homebrew.mxcl.jobber.plist"
site_agents_jobber_log: "{{ site_agents_state_dir }}/jobber/jobberrunner.log"
site_agents_jobber_error_log: "{{ site_agents_state_dir }}/jobber/jobberrunner.error.log"

# --- hermes-dashboard (Android / Tailscale companion) ----------------------
# Bind must match registry/ports.yml hermes-dashboard (Tailscale IP, not LAN).
site_agents_hermes_dashboard_enabled: true
site_agents_hermes_dashboard_label: "com.{{ site_ns }}.hermes-dashboard"
site_agents_hermes_dashboard_plist: >-
  {{ site_agents_launchagents_dir }}/{{ site_agents_hermes_dashboard_label }}.plist
site_agents_hermes_bin: "{{ site_agents_bin_dir }}/hermes"
site_agents_hermes_home: "{{ site_agents_home }}/.hermes"
site_agents_hermes_dashboard_bind: "100.113.53.87"
site_agents_hermes_dashboard_port: 9119
site_agents_hermes_dashboard_log: "{{ site_agents_hermes_home }}/logs/dashboard.log"
site_agents_hermes_dashboard_error_log: "{{ site_agents_hermes_home }}/logs/dashboard.error.log"


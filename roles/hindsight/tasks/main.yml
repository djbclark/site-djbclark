---
- name: Assert Hindsight is loopback-only and Darwin is supported
  ansible.builtin.assert:
    that:
      - hindsight_bind == '127.0.0.1'
      - ansible_facts.os_family == 'Darwin'
    fail_msg: Hindsight remains loopback-only and currently supports the managed macOS host only.

- name: Resolve uv
  ansible.builtin.command: command -v uv
  register: _hindsight_uv
  changed_when: false
  check_mode: false

- name: Require uv
  ansible.builtin.assert:
    that: _hindsight_uv.rc == 0
    fail_msg: Install uv before applying the Hindsight role.

# Only the openai-codex provider reads ~/.hindsight/codex/auth.json. Under the
# default proxy-backed provider there is no such file to gate on, and asserting
# on it would fail a host that is correctly configured.
- name: Require dedicated Codex authentication before service bootstrap
  ansible.builtin.stat:
    path: "{{ hindsight_codex_auth }}"
  register: _hindsight_codex_auth
  when: hindsight_llm_provider == 'openai-codex'

- name: Refuse unsafe Hindsight startup without dedicated auth
  ansible.builtin.assert:
    that:
      - _hindsight_codex_auth.stat.exists
      - _hindsight_codex_auth.stat.mode == '0600'
    fail_msg: >-
      Missing or unsafe {{ hindsight_codex_auth }}. Run CODEX_HOME={{ hindsight_codex_home }}
      codex auth login; credentials are never copied into Hermes or Git.
  when: hindsight_llm_provider == 'openai-codex'

# The proxy is the only backend under the default provider, so a Hindsight that
# cannot reach it is dead on arrival. Fail here with a clear cause rather than
# 30 health-check retries against a service that will never answer.
- name: Verify the LiteLLM proxy serves the configured Hindsight model
  ansible.builtin.uri:
    url: "{{ hindsight_llm_base_url }}/models"
    return_content: true
  register: _hindsight_proxy_models
  changed_when: false
  failed_when: false
  check_mode: false
  when: hindsight_llm_provider != 'openai-codex'

- name: Refuse to configure Hindsight against an unreachable model
  ansible.builtin.assert:
    that:
      - _hindsight_proxy_models.status == 200
      - hindsight_llm_model in (_hindsight_proxy_models.json.data | map(attribute='id') | list)
    fail_msg: >-
      {{ hindsight_llm_base_url }}/models did not serve {{ hindsight_llm_model }}
      (status {{ _hindsight_proxy_models.status | default('none') }}). Apply roles/litellm first.
  when: hindsight_llm_provider != 'openai-codex'

- name: Ensure Hindsight directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0700"
  loop:
    - "{{ hindsight_home }}/.hindsight"
    - "{{ hindsight_data_dir }}"
    - "{{ hindsight_codex_home }}"
    - "{{ hindsight_logs_dir }}"
    - "{{ hindsight_plist_dir }}"

- name: Ensure Hindsight candidate-ledger directory exists
  ansible.builtin.file:
    path: "{{ hindsight_candidate_ledger_dir }}"
    state: directory
    mode: "0700"
  tags: [hindsight_candidate_ledger]

- name: Install canonical Hindsight candidate ledger
  ansible.builtin.copy:
    src: "{{ role_path }}/../../bin/hindsight_memory_candidates.py"
    dest: "{{ hindsight_candidate_ledger_path }}"
    mode: "0700"
  tags: [hindsight_candidate_ledger]

- name: Create isolated Hindsight virtual environment
  ansible.builtin.command:
    argv: ["{{ _hindsight_uv.stdout | trim }}", "venv", "{{ hindsight_venv }}", "--python", "3.11"]
  args:
    creates: "{{ hindsight_venv }}/bin/python"
  when: not ansible_check_mode

- name: Install pinned Hindsight bundle
  ansible.builtin.command:
    argv: ["{{ _hindsight_uv.stdout | trim }}", "pip", "install", "--python", "{{ hindsight_venv }}/bin/python", "{{ hindsight_package_spec }}"]
  register: _hindsight_install
  changed_when: true
  when: not ansible_check_mode

- name: Render Hindsight LaunchAgent
  ansible.builtin.template:
    src: hindsight.plist.j2
    dest: "{{ hindsight_plist_path }}"
    mode: "0600"
  register: _hindsight_plist

- name: Probe Hindsight LaunchAgent
  ansible.builtin.command:
    argv: [launchctl, print, "gui/{{ ansible_facts.user_uid }}/{{ hindsight_label }}"]
  register: _hindsight_loaded
  changed_when: false
  failed_when: false
  check_mode: false

- name: Boot out changed Hindsight LaunchAgent
  ansible.builtin.command:
    argv: [launchctl, bootout, "gui/{{ ansible_facts.user_uid }}/{{ hindsight_label }}"]
  changed_when: true
  when:
    - not ansible_check_mode
    - _hindsight_plist.changed
    - _hindsight_loaded.rc == 0

# launchd does not finish tearing the job down before `bootout` returns, so a
# bootstrap issued immediately after loses the race and fails with
# `rc=5 Bootstrap failed: 5: Input/output error` -- observed on the ops-v1.4.1
# apply, which left Hindsight down. Re-running the identical command by hand a
# moment later succeeded, which is what identifies it as a teardown race rather
# than a bad plist. Retry rather than sleeping a fixed amount.
- name: Bootstrap Hindsight LaunchAgent
  ansible.builtin.command:
    argv: [launchctl, bootstrap, "gui/{{ ansible_facts.user_uid }}", "{{ hindsight_plist_path }}"]
  register: _hindsight_bootstrap
  changed_when: _hindsight_bootstrap.rc == 0
  failed_when: _hindsight_bootstrap.rc != 0
  until: _hindsight_bootstrap.rc == 0
  retries: 10
  delay: 3
  when:
    - not ansible_check_mode
    - _hindsight_loaded.rc != 0 or _hindsight_plist.changed

- name: Wait for Hindsight health
  ansible.builtin.uri:
    url: "{{ hindsight_health_url }}"
    status_code: 200
  register: _hindsight_health
  until: _hindsight_health.status == 200
  retries: 30
  delay: 5
  when: not ansible_check_mode

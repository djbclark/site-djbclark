---
# Hindsight was retired on 2026-09-30 (hindsight_enabled: false). The role stays
# so the retirement is what `just hindsight-apply` enforces, and so flipping the
# flag brings the whole service back from one place.
- name: Configure Hindsight
  ansible.builtin.include_tasks: enabled.yml
  when: hindsight_enabled | bool

- name: Retire Hindsight
  ansible.builtin.include_tasks: disabled.yml
  when: not (hindsight_enabled | bool)

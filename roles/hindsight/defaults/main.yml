---
# Site-owned Hindsight API. Loopback-only until an authenticated remote design exists.
hindsight_home: "{{ (ansible_facts.get('env') or {}).get('HOME') | default(lookup('env', 'HOME'), true) }}"
hindsight_bind: "127.0.0.1"
hindsight_port: 8888
hindsight_version: "0.9.0"
hindsight_package_spec: "hindsight-all=={{ hindsight_version }}"
hindsight_venv: "{{ hindsight_home }}/.hindsight/venv"
hindsight_candidate_ledger_dir: "{{ hindsight_home }}/.hindsight/bin"
hindsight_candidate_ledger_path: "{{ hindsight_candidate_ledger_dir }}/hindsight_memory_candidates.py"
hindsight_api_bin: "{{ hindsight_venv }}/bin/hindsight-api"
hindsight_codex_home: "{{ hindsight_home }}/.hindsight/codex"
hindsight_codex_auth: "{{ hindsight_codex_home }}/auth.json"
hindsight_data_dir: "{{ hindsight_home }}/.hindsight/data"
hindsight_logs_dir: "{{ hindsight_home }}/Library/Logs/hindsight"
# Log budget (2026-09-26, operator: <= 100 MB per logs dir incl. rotated). Had
# reached ~600 MB unrotated (stdout.log + stderr.log), mostly fact-extraction
# stack traces and repeated slow-DB-pool warnings. Shared filter/rotator with
# roles/litellm; 20 MB x (1 + 3) = 80 MB. The Hermes cron "LLM Backend Health"
# warns if this directory exceeds 100 MB.
hindsight_logpipe_script: "{{ playbook_dir | dirname }}/bin/litellm_logpipe.py"
hindsight_log_max_bytes: 20000000
hindsight_log_backups: 3
hindsight_plist_dir: "{{ hindsight_home }}/Library/LaunchAgents"
hindsight_label: "com.{{ site_ns }}.hindsight-api"
hindsight_plist_path: "{{ hindsight_plist_dir }}/{{ hindsight_label }}.plist"
hindsight_health_url: "http://{{ hindsight_bind }}:{{ hindsight_port }}/health"
hindsight_service_path: "{{ hindsight_home }}/.local/bin:/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin"

# LLM backend. Hindsight talks to the site-local LiteLLM proxy (roles/litellm)
# rather than a hosted API, so no provider key is embedded here or in the
# rendered plist. The proxy holds the real credentials in its own mode-0600
# unit.
#
# 2026-09-25 (SUPERSEDED next day — see the 2026-09-26 block below; kept for
# the chronology): moved off clinepass-deepseek. ClinePass began answering "model
# not found" for deepseek-v4-flash around 2026-09-21, and every retain and
# reflect failed for four days (about 260 ops backlogged). minimax-m3 was the
# 2026-08-22 bake-off pick (matched deepseek-v4-pro at 2-5x the speed). The
# proxy now falls back to kimi-k3, deepseek, and then the Gemini free tier, and
# the Hermes cron "LLM Backend Health" alerts on any fallback or retain failure.
#
# Provider is "openai" (not "clinepass"/"litellm"): Hindsight's factory routes
# openai to OpenAICompatibleLLM, which is what an OpenAI-compatible proxy needs.
# See create_llm_provider() in hindsight_api/engine/llm_wrapper.py.
hindsight_llm_provider: "openai"
hindsight_llm_base_url: "http://127.0.0.1:4000/v1"
# 2026-09-26: moved off ClinePass entirely. `aiuse` that morning read the
# ClinePass weekly window at 100% used (resets 09-29T12:56Z) and the MONTHLY at
# 99% (resets 10-16T07:42Z), so the weekly reset returns ~1% of a month and is
# immediately gone again. Hindsight's fact extraction across 32 banks is what
# spent it — a bare `curl` to api.cline.bot returns the same INFERENCE_CAP_ERROR
# with LiteLLM out of the path, so this was never a proxy bug.
#
# grok-sub (SuperGrok via the xAI OAuth bridge) was already proven here as the
# reflect model and as the fallback that carried retain through the outage. The
# proxy falls back grok-sub -> Gemini free tier -> ClinePass, so this degrades
# in speed, not availability. Revert after 2026-10-16 only if `aiuse` shows the
# ClinePass MONTHLY window actually recovered.
#
# Standing rule this restores: site-private memory reference_ai_service_matrix
# says ClinePass feeds Hindsight+hermes but "never bulk-route there".
hindsight_llm_model: "grok-sub"

# Not a secret. Hindsight's requires_api_key() rejects an empty key for the
# openai provider, and the proxy sets no general_settings.master_key, so it
# accepts any bearer token. This placeholder satisfies the client-side check
# without putting a credential in a tracked template.
hindsight_llm_api_key_placeholder: "sk-litellm-local"

# Reflect (the deep-reasoning path) goes through the same proxy. It has no
# usable default base_url once the provider is "openai", so it must be set
# explicitly rather than inherited.
hindsight_reflect_llm_provider: "{{ hindsight_llm_provider }}"
hindsight_reflect_llm_base_url: "{{ hindsight_llm_base_url }}"
# 2026-09-26 (operator decision): reflect runs on the SuperGrok subscription
# (`grok-sub`, via roles/litellm's xAI OAuth bridge). On ClinePass minimax-m3 a
# reflect took 70-120s, and the Claude plugin's session-start reflect is capped
# at ~40s, so every auto-reflect was cancelled. grok-sub answers in seconds. The
# proxy falls back grok-sub -> ClinePass models -> Gemini free tier, so a
# SuperGrok outage or rate limit degrades speed, not availability.
hindsight_reflect_llm_model: "grok-sub"
hindsight_reflect_max_context_tokens: 30000
hindsight_reflect_max_iterations: 4

# Must exceed roles/litellm's request_timeout (600s), or Hindsight hangs up
# first and the proxy's longer timeout buys nothing. Keep this the larger of
# the two whenever either moves.
hindsight_llm_timeout: 660

# ClinePass honours reasoning_effort -- low vs high measurably changes the
# request the upstream builds. The saving on this model is unproven (reasoning
# tokens barely moved on a small prompt), so this is a cheap, reversible
# default rather than a load-bearing optimisation. Reflect deliberately does
# not set it: that path is where reasoning earns its cost.
hindsight_llm_reasoning_effort: "low"

# Embeddings stay local (no API cost, no egress); reranking is reciprocal-rank
# fusion, which needs no model at all.
hindsight_embeddings_provider: "local"
hindsight_embeddings_local_model: "BAAI/bge-small-en-v1.5"
hindsight_reranker_provider: "rrf"

# Postgres connection pool (added 2026-09-26 after a real incident).
#
# Hindsight ships DB_POOL_MAX_SIZE=100 and the READ pool falls back to the same
# number, so one API process can open up to ~200 backends. Embedded pg0 is
# process-per-connection, so that is ~200 OS processes on what is here an
# 8-core / 16 GB laptop.
#
# What actually happened: re-queueing ~244 backlogged retain ops grew the pool
# to ~90 backends. asyncpg NEVER SHRINKS A POOL once it has grown, so two hours
# later 71 of them were still sitting `idle` with 2 waiting and 1 active — 96%
# dead weight that does not go away without a restart. Contention showed up as
# ~195 "slow DB pool acquire" warnings/minute in hindsight.log while the API
# stopped answering, and the box went to load ~70 with 11 GB of swap and
# WindowServer starved enough to visibly drop keystrokes.
#
# Upstream knows: vectorize-io/hindsight#4754 (pool max 100 vs embedded pg
# max_connections 100 — they collide exactly) and PR #4759. Their small-
# deployment guidance is min 2 / max 10; docs note each concurrent recall/think
# can use 2-4 connections, and worker_max_slots defaults to 10.
#
# Sized for this machine rather than their default: 16 primary is generous
# against 10 worker slots (measured peak concurrency was ~3), 8 read, min 2 each
# so idle cost is ~4 backends instead of ~10. Worst case ~24, not ~200.
#
# Raising these is the right move ONLY if "slow DB pool acquire" reappears with
# backends actually `active`. Idle backends mean the pool is too big, not too
# small — check with:
#   ps -Ao command | grep '^postgres: ' | awk '{print $NF}' | sort | uniq -c
hindsight_db_pool_min_size: 2
hindsight_db_pool_max_size: 16
hindsight_read_db_pool_min_size: 2
hindsight_read_db_pool_max_size: 8

# Recall budgets, in facts per tier.
hindsight_recall_budget_low: 50
hindsight_recall_budget_mid: 150
hindsight_recall_budget_high: 400
hindsight_recall_include_chunks: false

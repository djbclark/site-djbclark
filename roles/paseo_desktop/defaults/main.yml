---
# Paseo desktop (brew cask `paseo`, github.com/getpaseo/paseo) on the Mac. The app starts and owns its
# own daemon; this role only sets that daemon's config.json and publishes it on the tailnet. The Linux
# hosts run the daemon from forgejo.mit.edu/djbclark/paseo-nix instead (docs/paseo.md).
paseo_desktop_cli: /opt/homebrew/bin/paseo
paseo_desktop_app: /Applications/Paseo.app
paseo_desktop_label: com.djbclark.paseo-desktop
paseo_desktop_plist_path: "{{ ansible_facts.user_dir }}/Library/LaunchAgents/{{ paseo_desktop_label }}.plist"
paseo_desktop_port: 7263
# Tailnet HTTPS port of `tailscale serve` (registry/ports.yml tailscale_serve_port). Never funnel.
paseo_desktop_serve_port: 7263
# Daemon config keys (`paseo daemon config set PATH VALUE`; values are JSON). No password and no relay:
# the tailnet is the boundary (djbclark, 2026-10-18).
paseo_desktop_config:
  daemon.listen: '"127.0.0.1:{{ paseo_desktop_port }}"'
  daemon.hostnames: '["{{ caddy_public_hostname }}"]'
  daemon.relay.enabled: "false"
  features.webUi.enabled: "true"
  # Archive a clean, fully pushed Paseo-owned worktree workspace once its PR merges (djbclark, 2026-10-23).
  daemon.autoArchiveAfterMerge: "true"
# Paseo.app's own settings (desktop-settings.json "settings", merged key by key). The daemon outlives the
# app (djbclark, 2026-10-18), so quitting the window never stops running agents. The app reads it at start.
paseo_desktop_settings_path: "{{ ansible_facts.user_dir }}/Library/Application Support/Paseo/desktop-settings.json"
paseo_desktop_settings:
  daemon:
    keepRunningAfterQuit: true

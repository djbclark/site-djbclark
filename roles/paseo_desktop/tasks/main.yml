---
- name: Check the Paseo cask is installed
  ansible.builtin.stat:
    path: "{{ paseo_desktop_cli }}"
  register: _paseo_desktop_cli

- name: Fail without the Paseo cask
  ansible.builtin.fail:
    msg: "brew install --cask paseo first (brew/fragments/paseo.yml)"
  when: not _paseo_desktop_cli.stat.exists

- name: Read the daemon config
  ansible.builtin.command:
    argv: ["{{ paseo_desktop_cli }}", daemon, config, get, --json]
  register: _paseo_desktop_config
  changed_when: false
  check_mode: false

- name: Set daemon config keys
  # `config set` saves config.json; a running daemon applies some keys live and the rest at its next
  # start (the app's Settings -> host -> Restart daemon, or quitting and reopening the app).
  ansible.builtin.command:
    argv: ["{{ paseo_desktop_cli }}", daemon, config, set, "{{ item.key }}", "{{ item.value }}"]
  loop: "{{ paseo_desktop_config | dict2items }}"
  vars:
    _current: "{{ (_paseo_desktop_config.stdout | from_json).value }}"
    _path: "{{ item.key.split('.') }}"
    _have: >-
      {%- set ns = namespace(v=_current) -%}
      {%- for k in _path -%}{%- set ns.v = (ns.v[k] if (ns.v is mapping and k in ns.v) else none) -%}{%- endfor -%}
      {{ ns.v | to_json }}
  when: (_have | from_json) != (item.value | from_json)

- name: Check current tailscale serve configuration
  ansible.builtin.command:
    argv: [tailscale, serve, status, --json]
  register: _paseo_desktop_serve_status
  changed_when: false
  check_mode: false

- name: Publish the daemon on the tailnet with tailscale serve
  ansible.builtin.command:
    argv:
      - tailscale
      - serve
      - --bg
      - "--https={{ paseo_desktop_serve_port }}"
      - "http://127.0.0.1:{{ paseo_desktop_port }}"
  vars:
    _key: "{{ caddy_public_hostname }}:{{ paseo_desktop_serve_port }}"
    _doc: "{{ (_paseo_desktop_serve_status.stdout | from_json) | default({}, true) }}"
  when: >-
    (_doc.get('Web', {}).get(_key, {}).get('Handlers', {}).get('/', {}).get('Proxy', ''))
    != ('http://127.0.0.1:' ~ paseo_desktop_port)

- name: Merge Paseo.app desktop settings
  # Atomic rewrite (temp file, then rename) of only the keys in paseo_desktop_settings; prints "changed".
  ansible.builtin.command:
    argv:
      - python3
      - -I
      - -c
      - |
        import json, os, sys, tempfile
        path, want = sys.argv[1], json.loads(sys.argv[2])
        doc = json.load(open(path)) if os.path.exists(path) else {"version": 1, "settings": {}}
        def merge(dst, src):
            hit = False
            for k, v in src.items():
                if isinstance(v, dict) and isinstance(dst.get(k), dict):
                    hit |= merge(dst[k], v)
                elif dst.get(k) != v:
                    dst[k] = v
                    hit = True
            return hit
        if merge(doc.setdefault("settings", {}), want):
            fd, tmp = tempfile.mkstemp(dir=os.path.dirname(path))
            with os.fdopen(fd, "w") as f:
                json.dump(doc, f, indent=2)
                f.write("\n")
            os.chmod(tmp, 0o644)
            os.replace(tmp, path)
            print("changed")
      - "{{ paseo_desktop_settings_path }}"
      - "{{ paseo_desktop_settings | to_json }}"
  register: _paseo_desktop_settings
  changed_when: "'changed' in _paseo_desktop_settings.stdout"
  when: not ansible_check_mode

- name: Render the Paseo login LaunchAgent
  # The daemon lives only while the app runs (djbclark, 2026-10-18: start it at login, in the background),
  # so phones and the other hosts can always reach it. A LaunchAgent running `open -g -j`, not a login
  # item: macOS ignores a login item's `hidden` flag, so the window would open at every login.
  ansible.builtin.template:
    src: paseo-desktop.plist.j2
    dest: "{{ paseo_desktop_plist_path }}"
    mode: "0644"
  register: _paseo_desktop_plist

- name: Remove a Paseo login item (the LaunchAgent replaces it)
  ansible.builtin.command:
    argv:
      - osascript
      - -e
      - tell application "System Events"
      - -e
      - set n to count (every login item whose name is "Paseo")
      - -e
      - delete (every login item whose name is "Paseo")
      - -e
      - return n
      - -e
      - end tell
  register: _paseo_desktop_login_item
  changed_when: _paseo_desktop_login_item.stdout | trim != "0"
  check_mode: false
  when: not ansible_check_mode

- name: Probe the Paseo login LaunchAgent
  ansible.builtin.command:
    argv: [launchctl, print, "gui/{{ ansible_facts.user_uid }}/{{ paseo_desktop_label }}"]
  register: _paseo_desktop_loaded
  changed_when: false
  failed_when: false
  check_mode: false

- name: Boot out the changed Paseo login LaunchAgent
  ansible.builtin.command:
    argv: [launchctl, bootout, "gui/{{ ansible_facts.user_uid }}/{{ paseo_desktop_label }}"]
  changed_when: true
  when:
    - not ansible_check_mode
    - _paseo_desktop_plist.changed
    - _paseo_desktop_loaded.rc == 0

# launchd teardown race: bootstrap right after bootout can fail with rc=5. Retry, don't sleep.
- name: Bootstrap the Paseo login LaunchAgent
  ansible.builtin.command:
    argv: [launchctl, bootstrap, "gui/{{ ansible_facts.user_uid }}", "{{ paseo_desktop_plist_path }}"]
  register: _paseo_desktop_bootstrap
  changed_when: _paseo_desktop_bootstrap.rc == 0
  failed_when: _paseo_desktop_bootstrap.rc != 0
  until: _paseo_desktop_bootstrap.rc == 0
  retries: 10
  delay: 3
  when:
    - not ansible_check_mode
    - _paseo_desktop_loaded.rc != 0 or _paseo_desktop_plist.changed

- name: Check whether Paseo.app is running
  ansible.builtin.command:
    argv: [pgrep, -f, "{{ paseo_desktop_app }}/Contents/MacOS/"]
  register: _paseo_desktop_running
  changed_when: false
  failed_when: false
  check_mode: false

- name: Start Paseo.app in the background
  ansible.builtin.command:
    argv: [open, -g, -j, -a, "{{ paseo_desktop_app }}"]
  when: _paseo_desktop_running.rc != 0

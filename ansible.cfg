[defaults]
# Two inventory sources, in precedence order (later wins):
#   1. generated/stayturgid/inventory — product-owned taxonomy group_vars,
#      generated by `just site-sync` (DO NOT EDIT). Host-less; group_vars only.
#   2. inventory/hosts.yml — this site's real hosts + site-specific group_vars,
#      which override the product defaults above.
inventory = generated/stayturgid/inventory,inventory/hosts.yml
# Site-owned roles (litellm, site_agents). Justfile also prepends this
# path via ANSIBLE_ROLES_PATH alongside the sibling stayturgid product roles.
roles_path = roles
# Product collections are supplied by the sibling stayturgid checkout.
host_key_checking = False
retry_files_enabled = False
interpreter_python = auto_silent

[ssh_connection]
pipelining = True
# Ansible's default ssh_args with ControlPersist=10m instead of 60s: the master
# connection survives Mac-side stretches and the gaps between ansible-playbook
# runs of one deploy, so they reuse one SSH login instead of paying a new one.
ssh_args = -C -o ControlMaster=auto -o ControlPersist=10m

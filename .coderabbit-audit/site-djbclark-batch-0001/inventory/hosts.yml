---
# ══════════════════════════════════════════════════════════════════════════
# SITE FILE — the ONLY place person/device-specific facts live.
# Everything else in this repo is generic. A new device = add a host here,
# assign it to the taxonomy groups that describe it, done. Quirks for each
# taxonomy layer live in ansible/group_vars/<group>.yml (generic knowledge,
# shared by anyone with such a device — increasingly specific wins:
# role defaults < all < android_* < vendor_* < oneui_* < model_* < host).
# ══════════════════════════════════════════════════════════════════════════
all:
  vars:
    # Control-node Hermes Telegram allowlist (site-only; not a secret).
    # Bot token stays in ~/.hermes/.env (TELEGRAM_BOT_TOKEN) — never in git.
    stayturgid_hermes_telegram_allowed_users: "838808636"
    stayturgid_hermes_telegram_home_channel: "838808636"
  children:
    # ---- fleet membership (deploy target set) -----------------------------
    # Host order: s24 → hd8 → p7a is the agent default for single-host tests.
    stayturgid:
      hosts:
        s24:
          ansible_host: 100.123.218.30      # Tailscale IP
          device_usb_serial: RFCX219CHKA
          device_lan_ip: 192.168.68.54
          device_label: Galaxy S24
          # Native-agent desired state: independently keep hd8's Shizuku up.
          # Normal fleet deploy owns peer.json; do not provision it ad hoc.
          stayturgid_native_agent_peer_targets:
            - "100.124.55.39:5555"
          firerpa_enabled: true
        p7a:
          ansible_host: 100.65.230.108      # Tailscale IP
          device_usb_serial: 35261JEHN12374
          device_lan_ip: 192.168.68.60
          device_label: Pixel 7a
          # Redundant native-agent peer for hd8. This converges automatically
          # when p7a next participates in a normal fleet deploy.
          stayturgid_native_agent_peer_targets:
            - "100.124.55.39:5555"
          # v10 exits before listening on the current API 37 OS. Keep the
          # incompatibility visible without restart-looping the closed runtime.
          firerpa_enabled: false
          firerpa_runtime_status: pending-incompatible-runtime
        hd8:
          ansible_host: 100.124.55.39       # Tailscale IP
          device_usb_serial: GN43T503430603PS
          device_lan_ip: 192.168.1.157
          device_label: Kindle Fire HD 8
          firerpa_enabled: true
          # Fire OS prevents Termux from executing shell_data_file content and
          # tears down direct rish children. Mac ADB supplies persistent
          # UID 2000.
          firerpa_recovery_mode: control-node-adb
      vars:
        ansible_port: 8022
        ansible_user: djbclark              # Termux ignores it; auth is by key
        ansible_python_interpreter: /data/data/com.termux/files/usr/bin/python
        ansible_ssh_private_key_file: >-
          {{ lookup('env', 'HOME') }}/.ssh/termux_key
        stayturgid_device_id: "{{ inventory_hostname }}"
        stayturgid_automation_mode: ""

    # ---- site AI stack targets (Phase E5 multi-host LiteLLM) --------------
    # Registry host keys in registry/ports.yml must match inventory_hostname.
    # Default apply limit is mac (live). Planned hosts skip the role until
    # site_host_status is cleared and ansible_host is a reachable address.
    site_litellm:
      hosts:
        mac:
          ansible_connection: local
          # Control node — Apple Silicon; Homebrew /opt/homebrew (facts).
          site_host_status: online
          site_host_arch_note: "Apple Silicon M1 Air; live E1–E4 baseline"
        mac-mini-intel:
          # E5: not present on the operator tailnet (2026-07-20). Set
          # ansible_host to Tailscale IP or MagicDNS when the mini is online,
          # then site_host_status: online and re-apply with --limit.
          ansible_user: djbclark
          ansible_host: mac-mini-intel
          site_host_status: offline_unprovisioned
          site_host_arch_note: >-
            Intel Mac mini; Homebrew /usr/local
            (stayturgid_homebrew_prefix)
        vps-primary:
          # First Linux VPS slot. Operator fills ansible_host (Tailscale IP
          # preferred) when the VPS exists; systemd user unit, not launchd.
          ansible_user: djbclark
          ansible_host: vps-primary
          site_host_status: offline_unprovisioned
          site_host_arch_note: >-
            Linux VPS; systemd --user unit com.djbclark.litellm
      vars:
        litellm_enabled: true

    # ---- taxonomy (quirks come from group_vars/<name>.yml) ----------------
    android_16:
      hosts: {s24: {}, p7a: {}}
    android_11:
      hosts: {hd8: {}}
    vendor_google:
      hosts: {p7a: {}}
    vendor_samsung:
      hosts: {s24: {}}
    oneui_7:
      hosts: {s24: {}}
    model_pixel_7a:
      hosts: {p7a: {}}
    model_galaxy_s24:
      hosts: {s24: {}}
    vendor_amazon:
      hosts: {hd8: {}}
    model_kindle_hd8:
      hosts: {hd8: {}}

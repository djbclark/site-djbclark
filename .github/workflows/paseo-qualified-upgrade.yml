name: paseo-qualified-upgrade
on:
  push:
    branches: [paseo-qualified-upgrade]
    paths:
      - 'bin/paseo-local-upgrade'
      - 'bin/paseo_upgrade_policy.py'
      - 'tests/test_paseo*upgrade.py'
      - '.github/workflows/paseo-qualified-upgrade.yml'
  pull_request:
    paths:
      - 'bin/paseo-local-upgrade'
      - 'bin/paseo_upgrade_policy.py'
      - 'tests/test_paseo*upgrade.py'
      - '.github/workflows/paseo-qualified-upgrade.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Mocked source qualification tests (no Mac, no live upgrader)
        run: uv run --with pytest --with pyyaml python -m pytest -q tests/test_paseo_qualified_upgrade.py

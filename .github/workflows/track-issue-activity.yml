# Tracks third-party GitHub issues (and Discussions) opened by djbclark for
# activity and notifies via Telegram. Runs on GitHub Actions infra (no Mac
# dependency).
#
# Add a new issue to the matrix below when you open a new one. Discussions
# aren't covered by the REST Issues API, so give those entries `type:
# discussion` — everything else defaults to `type: issue`.
# Setup: TELEGRAM_BOT_TOKEN must be set as a repo secret.

name: Track issue activity

on:
  schedule:
    # Every hour — fast enough for issue replies, well within API rate limits
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      notify_even_if_unchanged:
        description: "Send a report even if nothing changed"
        type: boolean
        default: false

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  check-issues:
    name: ${{ matrix.repo }} #${{ matrix.number }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        issue:
          - repo: AltanS/collie
            number: "54"
            slug: collie-54
          - repo: KrishnaGupta653/telegcli
            number: "1"
            slug: telegcli-1
          - repo: thedjchi/Shizuku
            number: "269"
            slug: shizuku-fork-269
          - repo: RikkaApps/Shizuku
            number: "2310"
            slug: shizuku-2310
          - repo: subsy/ralph-tui
            number: "397"
            slug: ralph-tui-397
          - repo: osolmaz/telegram-bot-mux
            number: "2"
            slug: telegram-bot-mux-2
          - repo: cachix/secretspec
            number: "64"
            slug: secretspec-64
          - repo: NorthernTechHQ/libntech
            number: "290"
            slug: libntech-290
          - repo: cfengine/core
            number: "6293"
            slug: cfengine-core-6293
          - repo: cfengine/core
            number: "6294"
            slug: cfengine-core-6294
          - repo: cfengine/core
            number: "6295"
            slug: cfengine-core-6295
            type: discussion
          - repo: cfengine/core
            number: "6296"
            slug: cfengine-core-6296
            type: discussion
    steps:
      - uses: actions/checkout@v4

      - name: Restore previous state
        id: cache-state
        uses: actions/cache/restore@v4
        with:
          path: .cache/gh-tracker/${{ matrix.issue.slug }}.json
          # Unique key per run + prefix restore: GitHub caches are immutable,
          # so a static key could never be overwritten (caused duplicate
          # notifications). Prefix restore picks the newest saved entry.
          # v3 prefix: ignore v1/v2 caches that used an unreliable page-length
          # comment count instead of GitHub's authoritative issue comment count.
          key: gh-tracker-v3-${{ matrix.issue.slug }}-${{ github.run_id }}
          restore-keys: gh-tracker-v3-${{ matrix.issue.slug }}-

      - name: Fetch issue and compare
        id: check
        env:
          ISSUE_REPO: ${{ matrix.issue.repo }}
          ISSUE_NUMBER: ${{ matrix.issue.number }}
          ISSUE_TYPE: ${{ matrix.issue.type || 'issue' }}
          CACHE_FILE: .cache/gh-tracker/${{ matrix.issue.slug }}.json
        run: |
          mkdir -p .cache/gh-tracker

          if [ "$ISSUE_TYPE" = "discussion" ]; then
            # Discussions aren't in the REST Issues API at all (confirmed: a
            # discussion number 404s there) - GraphQL is the only route.
            owner="${ISSUE_REPO%%/*}"
            repo="${ISSUE_REPO##*/}"
            response=$(gh api graphql -f query='
              query($owner: String!, $repo: String!, $number: Int!) {
                repository(owner: $owner, name: $repo) {
                  discussion(number: $number) {
                    title
                    closed
                    updatedAt
                    comments { totalCount }
                  }
                }
              }' -f owner="$owner" -f repo="$repo" -F number="$ISSUE_NUMBER" 2>/dev/null) || response=""

            found=$(echo "$response" | python3 -c "import json,sys; d=json.load(sys.stdin); print('yes' if d.get('data',{}).get('repository',{}).get('discussion') else 'no')" 2>/dev/null) || found="no"

            if [ -z "$response" ] || [ "$found" != "yes" ]; then
              echo "fetch_ok=false" >> "$GITHUB_OUTPUT"
              echo "changed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "fetch_ok=true" >> "$GITHUB_OUTPUT"

            new_state=$(echo "$response" | python3 -c "import json,sys; d=json.load(sys.stdin)['data']['repository']['discussion']; print('closed' if d['closed'] else 'open')")
            new_count=$(echo "$response" | python3 -c "import json,sys; d=json.load(sys.stdin)['data']['repository']['discussion']; print(d['comments']['totalCount'])")
            new_updated=$(echo "$response" | python3 -c "import json,sys; d=json.load(sys.stdin)['data']['repository']['discussion']; print(d['updatedAt'])")
            new_title=$(echo "$response" | python3 -c "import json,sys; d=json.load(sys.stdin)['data']['repository']['discussion']; print(d['title'])")
          else
            # Fetch the issue once. GitHub's issue payload includes the authoritative
            # total comment count; do not use a per_page=1 comments response as a
            # count, because that stops detecting comments after the first one.
            response=$(curl -sf --retry 3 --retry-delay 2 --retry-all-errors \
              "https://api.github.com/repos/$ISSUE_REPO/issues/$ISSUE_NUMBER" 2>/dev/null) || response=""

            # If the fetch failed after retries, skip silently: no notification,
            # no cache write. Keep the last known good state for the next run.
            if [ -z "$response" ]; then
              echo "fetch_ok=false" >> "$GITHUB_OUTPUT"
              echo "changed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "fetch_ok=true" >> "$GITHUB_OUTPUT"

            new_state=$(echo "$response" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('state','unknown'))")
            new_count=$(echo "$response" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('comments',0))")
            new_updated=$(echo "$response" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('updated_at',''))")
            new_title=$(echo "$response" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('title',''))")
          fi

          echo "state=$new_state" >> "$GITHUB_OUTPUT"
          echo "comment_count=$new_count" >> "$GITHUB_OUTPUT"
          echo "updated_at=$new_updated" >> "$GITHUB_OUTPUT"
          echo "title=$new_title" >> "$GITHUB_OUTPUT"

          # Compare with cached state
          if [ -f "$CACHE_FILE" ]; then
            old_count=$(python3 -c "import json; print(json.load(open('$CACHE_FILE')).get('comment_count',-1))")
            old_state=$(python3 -c "import json; print(json.load(open('$CACHE_FILE')).get('state',''))")
            echo "had_cache=true" >> "$GITHUB_OUTPUT"
          else
            old_count=-1
            old_state=""
            echo "had_cache=false" >> "$GITHUB_OUTPUT"
          fi

          has_changed=false
          note=""
          state_change_note=""

          if [ "$new_state" != "$old_state" ] && [ -n "$old_state" ]; then
            has_changed=true
            state_change_note="State changed: $old_state → $new_state"
          fi

          if [ "$new_count" -gt "$old_count" ] && [ "$old_count" -ge 0 ]; then
            has_changed=true
            note="$((new_count - old_count)) new comment(s)"
          fi

          echo "changed=$has_changed" >> "$GITHUB_OUTPUT"
          echo "note=$note" >> "$GITHUB_OUTPUT"
          echo "state_change_note=$state_change_note" >> "$GITHUB_OUTPUT"

          # Save current state
          echo "{\"comment_count\":$new_count,\"state\":\"$new_state\",\"updated_at\":\"$new_updated\"}" > "$CACHE_FILE"

      - name: Save state cache
        # Save when something changed, OR on first run (no cache yet) to seed
        # the baseline — otherwise a cold start would never notify again.
        # Never save when the fetch failed (would poison the cache with bad state).
        if: steps.check.outputs.fetch_ok == 'true' && (steps.check.outputs.changed == 'true' || steps.check.outputs.had_cache == 'false' || (github.event_name == 'workflow_dispatch' && inputs.notify_even_if_unchanged == true))
        uses: actions/cache/save@v4
        with:
          path: .cache/gh-tracker/${{ matrix.issue.slug }}.json
          # Unique key per run — caches are immutable; a new key creates a new entry
          key: gh-tracker-v2-${{ matrix.issue.slug }}-${{ github.run_id }}

      - name: Notify via Telegram
        if: steps.check.outputs.fetch_ok == 'true' && (steps.check.outputs.changed == 'true' || (github.event_name == 'workflow_dispatch' && inputs.notify_even_if_unchanged == true))
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: "838808636"
          THREAD_ID: "22158"
          ISSUE_URL: "https://github.com/${{ matrix.issue.repo }}/${{ (matrix.issue.type || 'issue') == 'discussion' && 'discussions' || 'issues' }}/${{ matrix.issue.number }}"
        run: |
          REPO="${{ matrix.issue.repo }}"
          NUM="${{ matrix.issue.number }}"
          TITLE="${{ steps.check.outputs.title }}"
          NOTE="${{ steps.check.outputs.note }}"
          STATE_NOTE="${{ steps.check.outputs.state_change_note }}"
          STATE="${{ steps.check.outputs.state }}"

          MSG=$(cat <<EOF
          🔔 <b>$REPO#$NUM</b>

          <b>$TITLE</b>

          Status: <b>$STATE</b>
          EOF
          )

          if [ -n "$NOTE" ] && [ "$NOTE" != "null" ]; then
            MSG="$MSG"$'\n'"Comments: $NOTE"
          fi
          if [ -n "$STATE_NOTE" ] && [ "$STATE_NOTE" != "null" ]; then
            MSG="$MSG"$'\n'"$STATE_NOTE"
          fi

          MSG="$MSG"$'\n\n'"<a href=\"$ISSUE_URL\">Open on GitHub</a>"

          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg text "$MSG" \
              '{chat_id: $ENV.CHAT_ID | tonumber, message_thread_id: $ENV.THREAD_ID | tonumber, text: $text, parse_mode: "HTML", disable_web_page_preview: true}')" \
            | python3 -c "import json,sys; r=json.load(sys.stdin); print(r.get('description','') if r.get('ok') else 'ERROR: '+json.dumps(r,indent=2))"

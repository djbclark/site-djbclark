# Discovers new third-party issues djbclark is involved in and
# appends them to .github/tracked-issues.json (the matrix for
# track-issue-activity.yml). Opens a PR with additions. The list is a
# data file, not a workflow, because GITHUB_TOKEN cannot push changes
# to workflow files. No local dependencies — runs on GitHub infra.

name: Sync tracked issues

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print what would change without opening a PR"
        type: boolean
        default: false

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  sync:
    name: Discover and add new issues
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - name: Find third-party issues opened by djbclark
        id: discover
        run: |
          # Find issues I opened in repos I don't own, output as JSON
          gh search issues --author djbclark --limit 100 \
            --json repository,number,title,state,url \
            > /tmp/raw-issues.json 2>/dev/null || echo '[]' > /tmp/raw-issues.json

          # Filter to repos I don't own and save as text for next step
          python3 << 'PYEOF'
          import json

          OWNED = ['djbclark/stayturgid', 'djbclark/site-djbclark', 'djbclark/site-private']

          with open('/tmp/raw-issues.json') as f:
            issues = json.load(f)

          filtered = [i for i in issues if i['repository']['nameWithOwner'] not in OWNED]

          with open('/tmp/discovered-issues.json', 'w') as f:
            json.dump(filtered, f, indent=2)

          with open('/tmp/discovered-issues.txt', 'w') as f:
            for item in filtered:
              repo = item['repository']['nameWithOwner']
              num = item['number']
              title = item['title']
              url = item.get('url', f'https://github.com/{repo}/issues/{num}')
              f.write(f"{repo}|||{num}|||{title}|||{item.get('state','open')}|||{url}\n")

          print(f"Found {len(filtered)} third-party issues")
          PYEOF

      - name: Check for new issues against current matrix
        id: compare
        run: |
          python3 .github/scripts/sync_tracked_issues.py compare

      - name: Update workflow matrix
        id: update
        run: |
          new_count=$(python3 -c "import json; print(len(json.load(open('/tmp/new-issues.json'))))")
          if [ "$new_count" -eq 0 ]; then
            echo "No new issues to add."
            echo "updated=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          dry_run="${{ github.event.inputs.dry_run }}"
          if [ "$dry_run" = "true" ]; then
            echo "updated=false (dry run)" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          python3 .github/scripts/sync_tracked_issues.py update

          echo "updated=true" >> "$GITHUB_OUTPUT"

      - name: Create pull request
        if: steps.update.outputs.updated == 'true'
        run: |
          new_count=$(python3 -c "import json; print(len(json.load(open('/tmp/new-issues.json'))))")
          branch="auto/track-new-issues-$(date +%Y%m%d)"

          git config user.name "djbclark[bot]"
          git config user.email "131936+djbclark[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add .github/tracked-issues.json

          python3 << 'PYEOF'
          import json
          with open('/tmp/new-issues.json') as f:
              items = json.load(f)
          with open('/tmp/pr-body.txt', 'w') as f:
              f.write("## New third-party issues detected\n\nAuto-added tracking for:\n")
              for item in items:
                  f.write(f"- [{item['repo']}#{item['number']}]({item['url']}) - {item['title']}\n")
          PYEOF

          total=$(python3 -c "import json; print(f\"Total tracked: {len(json.load(open('.github/tracked-issues.json'))['issue'])} issues\")")
          echo "" >> /tmp/pr-body.txt
          echo "$total" >> /tmp/pr-body.txt

          # Git 2.55+ (GitHub-hosted runners) rejects combining -m and -F/--file.
          {
            echo "ci: auto-add $new_count new tracked issue(s)"
            echo
            cat /tmp/pr-body.txt
          } > /tmp/commit-msg.txt
          git commit -F /tmp/commit-msg.txt
          git push origin "$branch"

          label_args=()
          if gh label list --repo djbclark/site-djbclark --json name --jq '.[].name' | grep -qx automated; then
            label_args=(--label automated)
          fi
          gh pr create \
            --repo djbclark/site-djbclark \
            --base master \
            --head "$branch" \
            --title "ci: auto-add $new_count new tracked third-party issues ($(date +%Y-%m-%d))" \
            --body-file /tmp/pr-body.txt \
            "${label_args[@]}"

          echo "PR created on branch $branch"

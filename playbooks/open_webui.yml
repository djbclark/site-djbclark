---
- name: Configure the site Open WebUI workspace
  hosts: all
  gather_facts: false
  pre_tasks:
    - name: Skip Open WebUI on hosts not yet provisioned (no SSH) or still being provisioned
      ansible.builtin.meta: end_host
      when: (site_host_status | default('online')) in ['offline_unprovisioned', 'provisioning']

    - name: Gather facts for provisioned Open WebUI hosts
      ansible.builtin.setup:
  roles:
    - role: open_webui

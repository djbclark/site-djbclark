# Profile "night": more of the machine for unattended overnight builds, never set as the
# default. `gradle-limits set night --until 07:00` selects it with an expiry; `bg` and
# `gradle-limits check` put "low" back once it has expired. Numbers chosen by measurement
# (see the benchmark note in docs/gradle-limits.md): past them, more threads only raise load
# and slow the build down.
# Four parallel tasks at most (memory on 16 GB); each JVM's own pools size for 6 CPUs.
# Heap 3g (low uses 2g) for the parallel project execution; see low.properties for the GC flags.
org.gradle.workers.max=4
org.gradle.parallel=true
org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8 -XX:ActiveProcessorCount=6 -XX:G1PeriodicGCInterval=60000 -XX:MinHeapFreeRatio=10 -XX:MaxHeapFreeRatio=30 -Dkotlin.daemon.jvm.options=autoshutdownIdleSeconds=600
kotlin.daemon.jvmargs=-Xmx2g -XX:ActiveProcessorCount=6 -XX:G1PeriodicGCInterval=60000 -XX:MinHeapFreeRatio=10 -XX:MaxHeapFreeRatio=30
org.gradle.priority=low
org.gradle.daemon.idletimeout=600000

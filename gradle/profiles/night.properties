# Profile "night": more of the machine for unattended overnight builds, never set as the
# default. `gradle-limits set night --until 07:00` selects it with an expiry; `bg` and
# `gradle-limits check` put "low" back once it has expired. Numbers chosen by measurement
# (see the benchmark note in docs/gradle-limits.md): past them, more threads only raise load
# and slow the build down.
# Four parallel tasks at most (memory on 16 GB); each JVM's own pools size for 6 CPUs.
org.gradle.workers.max=4
org.gradle.parallel=true
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -XX:ActiveProcessorCount=6
kotlin.daemon.jvmargs=-Xmx2g -XX:ActiveProcessorCount=6
org.gradle.priority=low
org.gradle.daemon.idletimeout=1800000

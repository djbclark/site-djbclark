# Machine-wide Gradle limits for every project on this Mac (8 cores, 16 GB). User-level
# gradle.properties overrides each project's own, so builds here can never take the whole
# machine: on 2026-10-05 one R8 release build ran 112 threads and drove the load average past
# 130 (djbclark: "I'm fine with builds taking longer, just don't want 200-300 load").
# Profile "low" (the default). The active profile is chosen by ~/ops/site-private/bin/gradle-limits
# (`gradle-limits status|set night --until 07:00|low`); every Gradle home links to it through
# ~/.local/state/gradle-limits/gradle.properties. Run heavy builds through `bg` as well.

# At most two worker processes/threads for tasks, and no parallel project execution.
org.gradle.workers.max=2
org.gradle.parallel=false

# The daemon JVM believes it has 2 CPUs, so its own pools (R8, D8, the compiler, GC) size for
# 2, not 8. Heap: -Xmx2g, what Pastiera and ShizukuTendCF ask for themselves (physiboard's 4g
# was upstream's default and never needed; 2026-10-06). With 5+ daemons at 4g the 16 GB Mac
# sat 11 GB deep in swap and most of the "disk load" was paging.
# G1PeriodicGCInterval: an idle daemon runs a GC every 60 s and hands freed heap back to the
# OS (Min/MaxHeapFreeRatio 10/30; Min must be set too, its default 40 > 30 stops the JVM), instead of keeping its high-water mark until it exits.
# Do NOT add -Dkotlin.daemon.jvm.options=autoshutdownIdleSeconds=…, even though the Kotlin
# docs' example shows it: that property is a list of JVM options, so the Kotlin daemon JVM
# gets "-autoshutdownIdleSeconds=600", refuses to start, and every Kotlin compile fails or
# falls back to in-process (broke the machine's builds on 2026-10-06; docs bug KT-90109). The Kotlin daemon
# stops with its Gradle daemon, which exits after the 10 min idle timeout below.
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8 -XX:ActiveProcessorCount=2 -XX:G1PeriodicGCInterval=60000 -XX:MinHeapFreeRatio=10 -XX:MaxHeapFreeRatio=30
kotlin.daemon.jvmargs=-Xmx2g -XX:ActiveProcessorCount=2 -XX:G1PeriodicGCInterval=60000 -XX:MinHeapFreeRatio=10 -XX:MaxHeapFreeRatio=30

# Run the daemon at low OS priority.
org.gradle.priority=low

# An idle daemon exits after 10 min (default 3 h), so idle daemons from many worktrees don't
# sit in swap, and a profile switch does not leave old daemons around for long.
org.gradle.daemon.idletimeout=600000

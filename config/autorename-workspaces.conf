# Special workspaces for /autorename all (skills/autorename/workspace-layout.md).
# One name per line; everything after # is a hint about what belongs there.
# Whitespace around the name and the hint is ignored. A workspace listed here is
# created as soon as one tab belongs in it and sits at the top of herdr in this
# order; workspaces not listed follow; it is not created when it would be empty.
monitor # htop, tokscale, aiuse-watch. Tab order inside it: aiuse-watch, htop, tokscale
aiuse+ade # aiuse dev, djbclark-ade, secretspec, herdr, herdr plugins, orca, graft,
helm
ops-stayturgid # ops, site-private, site-djbclark, stayturgid, stayturgid-agent
ops-tendcf+nix2cf # tendcf, tendcf-agent, nix2cf, shizukuplus, shuzukutendcf
techno-euphora # monorepo for ai heaven etc
cfengine # cfengine, libntech
superbrain # youtube
remote # pastebin, vps-primary, other remote machines, ssh, mosh, et
one-offs

---
# ══════════════════════════════════════════════════════════════════════════
# SITE FILE — the ONLY place person/device-specific facts live.
# Everything else in this repo is generic. A new device = add a host here,
# assign it to the taxonomy groups that describe it, done. Quirks for each
# taxonomy layer live in ansible/group_vars/<group>.yml (generic knowledge,
# shared by anyone with such a device — increasingly specific wins:
# role defaults < all < android_* < vendor_* < oneui_* < model_* < host).
# ══════════════════════════════════════════════════════════════════════════
all:
  vars:
    # Control-node Hermes Telegram allowlist (site-only; not a secret).
    # Bot token stays in ~/.hermes/.env (TELEGRAM_BOT_TOKEN) — never in git.
    stayturgid_hermes_telegram_allowed_users: "838808636"
    stayturgid_hermes_telegram_home_channel: "838808636"
  children:
    # ---- fleet membership (deploy target set) -----------------------------
    # Individual Android devices live one-file-per-device under
    # inventory/devices.d/<alias>.yml (loaded via ansible.cfg directory
    # inventory). Shared stayturgid group vars stay here.
    stayturgid:
      vars:
        ansible_port: 8022
        ansible_user: djbclark              # Termux ignores it; auth is by key
        ansible_python_interpreter: /data/data/com.termux/files/usr/bin/python
        ansible_ssh_private_key_file: >-
          {{ lookup('env', 'HOME') }}/.ssh/termux_key
        stayturgid_device_id: "{{ inventory_hostname }}"
        stayturgid_automation_mode: ""

    # ---- site AI stack targets (Phase E5 multi-host LiteLLM) --------------
    # Registry host keys in registry/ports.yml must match inventory_hostname.
    # Default apply limit is mac (live). Planned hosts skip the role until
    # site_host_status is cleared and ansible_host is a reachable address.
    site_litellm:
      hosts:
        mac:
          ansible_connection: local
          # Control node — Apple Silicon; Homebrew /opt/homebrew (facts).
          site_host_status: online
          site_host_arch_note: "Apple Silicon M1 Air; live E1–E4 baseline"
        mac-mini-intel:
          # E5: not present on the operator tailnet (2026-07-20). Set
          # ansible_host to Tailscale IP or MagicDNS when the mini is online,
          # then site_host_status: online and re-apply with --limit.
          ansible_user: djbclark
          ansible_host: mac-mini-intel
          site_host_status: offline_unprovisioned
          site_host_arch_note: >-
            Intel Mac mini; Homebrew /usr/local
            (stayturgid_homebrew_prefix)
        vps-primary:
          # Hetzner CX23 (ubuntu-4gb-nbg1-1, #131169181), nbg1.
          # NixOS 26.05 SSD boot and root key-only SSH verified 2026-10-04.
          # Python + ansible ping pass (2026-10-08); keep provisioning until NixOS role audit passes.
          ansible_user: root
          ansible_host: 100.125.249.107
          ansible_port: 22
          ansible_python_interpreter: /run/current-system/sw/bin/python3
          # Tailnet address (tag:server, joined 2026-10-13; MagicDNS
          # vps-primary.greyhound-sidemirror.ts.net). ansible_host is the tailnet address since 2026-10-15.
          site_tailnet_address: 100.125.249.107
          # 2026-11-09: being retired; its services moved to vps-hub (checklist in the box workspace).
          site_host_status: retiring
          site_host_arch_note: >-
            Hetzner CX23 (2vCPU/4GB/40GB NVMe), NixOS 26.05, nbg1, public IP 2.28.231.104 (swapped from 178.105.34.223 on 2026-10-24: MIT blocked the old one; docs/google-proxy-vps-primary.md section 5).
            Hostname vps-primary; root key-only SSH; Python 3.13 (declarative) and ansible ping verified 2026-10-08; NixOS role compatibility not yet audited.
            Config is deployed from git (flake in nixos/, branch deploy-vps-primary): see docs/nixos-in-git.md;
            never run nixos-rebuild by hand on the host. Also runs the shared Gradle cache node (docs/gradle-remote-cache.md).
            First Linux target for a future full site stack (Caddy, LiteLLM systemd --user, observability).
            On the tailnet since 2026-10-13; Athena/AFS host since 2026-10-15 (docs/plans/vps-primary-athena.md). Runs Paseo; the agent user djbclark's home /home/djbclark is a Hetzner Volume (docs/agents-vps-primary.md, docs/paseo.md). Not currently required by audited deployed sites.
        vps-hub:
          # Contabo VPS (203736421), installed 2026-11-08 with nixos-anywhere as a clone of vps-primary;
          # took over vps-primary's services 2026-11-09 (Briefs, Gradle cache, sudo-secretspec, Hyades egress proxy).
          ansible_user: root
          ansible_host: 100.82.208.87
          ansible_port: 22
          ansible_python_interpreter: /run/current-system/sw/bin/python3
          # Tailnet address (tag:server; MagicDNS vps-hub.greyhound-sidemirror.ts.net).
          site_tailnet_address: 100.82.208.87
          site_host_status: active
          site_host_arch_note: >-
            Contabo VPS, NixOS 26.05, public IP 91.90.82.78 (ens18; IPv6 2a02:c207:2373:6421::1).
            Config is deployed from git (flake in nixos/, branch deploy-vps-hub, nixos/vps-hub/); unattended upgrade 04:00 UTC.
            Runs Paseo, Athena/AFS, the Briefs dashboard mirror, the Gradle cache (docs/gradle-remote-cache.md),
            the Hyades SearXNG egress proxy (docs/google-proxy-vps-primary.md) and a tailnet-only RustDesk hub.
      vars:
        litellm_enabled: true

    # Shared basic-memory MCP server (roles/basic_memory_mcp). Separate group so
    # applying it never touches the LiteLLM group, and vice versa.
    site_basic_memory_mcp:
      hosts:
        mac:
          ansible_connection: local
    # Shared crawl4ai / arxiv / paper-search MCP servers (roles/shared_mcp).
    site_shared_mcp:
      hosts:
        mac:
          ansible_connection: local

    # One launchd watchdog for every site service (roles/watchdogd).
    site_watchdogd:
      hosts:
        mac:
          ansible_connection: local

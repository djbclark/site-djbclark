# Where each top-level entry of ~/src appears in the ~/s farm.
#
#   <directory under ~/s>: <name or glob> <name or glob> ...
#
# The first matching line wins; globs are case-sensitive (fnmatch). The link
# keeps the entry's own name, so ~/s/<directory>/<name> -> ~/src/<name>.
# Entries that match nothing are placed automatically:
#   1. a git worktree goes beside its main repo;
#   2. '<repo>-worktrees' / '<repo>.worktrees' goes beside <repo>;
#   3. a loose file goes in files/;
#   4. anything else goes in unsorted/ and `just` names it until it gets a line here.
# Hidden entries (.DS_Store, .claude, ...) are never linked.
# 'by-owner' and 'by-kind' are generated views and cannot be used here.
# After editing: just -f ~/s/justfile plan, then just -f ~/s/justfile


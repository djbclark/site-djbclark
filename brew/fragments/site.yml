# Site-claimed Homebrew packages (source of truth for Merged-Brewfile).
# Hand-edited. Project with: just brew-project
stack: site
description: >-
  Packages the site repo owns: Goose (E2), SecretSpec (E4), F2 workstation
  claims (herdr, omlx), and site orchestration tooling.

taps:
  - name: jundot/omlx
    url: https://github.com/jundot/omlx
    note: omlx formula tap (F2 site claim)

formulae:
  - name: block-goose-cli
    note: roles/goose E2 CLI
  - name: secretspec
    note: SecretSpec CLI; LiteLLM key injection (E4)
  - name: herdr
    note: F2 site claim — workstation AI workspace manager (UDS)
  - name: jundot/omlx/omlx
    note: F2 site claim — local MLX LLM server 127.0.0.1:8000
  - name: jobber
    note: Jobber daemon for scheduled background jobs
  - name: just
    note: site justfile runner

casks:
  - name: block-goose
    note: roles/goose E2 Desktop app

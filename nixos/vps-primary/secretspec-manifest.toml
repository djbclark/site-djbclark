# Declarations template for vps-primary's sudo-secretspec vault: names, descriptions and
# requirements only, never values. Public repo on purpose.
#
# Copied into the vault as `secretspec.toml` once (systemd-tmpfiles `C` never overwrites);
# `sudo-secretspec template-check` compares the runtime manifest against this tracked copy.
#
# The binary rejects a profile with no secrets ("Profile must define at least one secret",
# secretspec/src/config.rs), so an empty `[profiles.default]` is invalid. This one optional
# placeholder (HOST_SMOKE_TEST, never set) keeps the manifest valid and `check` green while the vault holds no real
# credential. Replace it (release the new names here first, then `sudo-secretspec add` / `set`
# at runtime) when the first real secret is chosen.

[project]
name = "vps-primary"
revision = "1.0"

[profiles.default]
HOST_SMOKE_TEST = { description = "Reserved placeholder; add real names with sudo-secretspec add", required = false }
